</style></head><body><div class="shell"><header class="top"><div class="brand"><span class="brandmark" aria-hidden="true">▤</span><div><b>دفتر الفروع</b><small>المصاريف والمشتريات</small></div></div><span class="badge">إدارة الفروع</span></header><div class="heading"><div><p class="eyebrow" id="eyebrow">نظرة على الأرقام</p><h1 id="pageTitle">كل مصاريفك، بمكان واحد.</h1></div><button class="btn primary" id="addTop" onclick="newRecord()" disabled aria-label="إضافة سجل">＋ <span class="add-label">إضافة سجل</span></button></div><nav class="nav" aria-label="شاشات التطبيق"><button data-view="overview" aria-current="page" onclick="navigate('overview')"><span aria-hidden="true">◫</span>الملخص</button><button data-view="records" onclick="navigate('records')"><span aria-hidden="true">≡</span>السجلات</button><button data-view="new" onclick="newRecord()"><span aria-hidden="true">＋</span>إضافة</button><button data-view="branches" onclick="navigate('branches')"><span aria-hidden="true">⌂</span>الفروع</button></nav><div id="error" class="notice error" role="alert" hidden></div><div id="filters" class="filters" hidden><label>الفرع<select id="filterBranch" onchange="render()"><option value="">كل الفروع</option></select></label><label>من تاريخ<input id="filterFrom" type="date" onchange="render()"></label><label>إلى تاريخ<input id="filterTo" type="date" onchange="render()"></label><button class="btn" onclick="clearFilters()">مسح الفلاتر</button></div><div id="main" aria-live="polite"><div class="panel loader"><div class="spinner"></div>جارٍ قراءة بيانات الجدول…</div></div><p class="source-note" id="syncNote"></p><footer class="footer">دفتر الفروع · <a href="https://docs.google.com/spreadsheets/d/14z4ki8u1X87EnS5S024U0DEYwOAYQUY9_L8QTI_ssB8/edit#gid=0" target="_blank" rel="noopener">فتح Google Sheets ↗</a></footer></div><div id="toast" role="status" hidden></div><dialog id="dialog" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="actions"><button class="btn" id="dialogCancel" onclick="closeDialog()">إلغاء</button><button class="btn primary" id="dialogConfirm">تأكيد</button></div></dialog><script>
'use strict';
const labels=['شراء وكلاء الضفة','شراء وكلاء إسرائيل','رواتب الموظفين والمخازن','مصاريف أخرى','إيجار المحلات','أرنونا','مشتريات تركيا والصين','أجرة المحاسب','ضريبة القيمة المضافة','التأمين الوطني','التقاعد','دفعات ضريبة الدخل','الإعلانات'];
const originals=['شراء وكلاء الضفه','شراء وكلاء اسرائيل','رواتب موظفين-ومخازن','הוצאות','ايجار محلات','ارنونا','مشتريات تركيا والصين','اجره محاسب','מע"מ','ביטוח לאומי','פינסה','מס הכנסה מקדימות','اعلانات'];
let data={records:[],branches:[]},loaded=false,busy=false,view='overview',draft=null,dirty=false,trash=false,search='',confirmAction=null,toastTimer;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(n/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₪';
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function uid(){return crypto.randomUUID?crypto.randomUUID():'r-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,5000)}
function showError(e){$('error').textContent=e&&e.message?e.message:String(e);$('error').hidden=false}
const endpoint='https://script.google.com/macros/s/AKfycbz-t9KSyd038rxInmJp5eT1MStT3mI0YJIKj3eenyLnq97tkGMnCbDUA3JfZrKt8Pt5rA/exec';
const channel=crypto.randomUUID(),pending=new Map();let bridgeWindow=null,bridgeOrigin=null,bridgePromise=null;
window.addEventListener('message',e=>{const m=e.data;if(!m||m.channel!==channel||!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin))return;if(m.type==='dftr:ready'){bridgeWindow=e.source;bridgeOrigin=e.origin;return}if(e.source!==bridgeWindow||e.origin!==bridgeOrigin||m.type!=='dftr:response')return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(Error(m.error)):p.resolve(m.result)});
function connectBridge(){if(bridgeWindow)return Promise.resolve();if(bridgePromise)return bridgePromise;bridgePromise=new Promise((resolve,reject)=>{let frame=document.getElementById('dataBridge');if(!frame){frame=document.createElement('iframe');frame.id='dataBridge';frame.title='اتصال البيانات';frame.hidden=true;frame.src=endpoint+'?bridge=1&channel='+encodeURIComponent(channel);document.body.appendChild(frame)}const started=Date.now();const timer=setInterval(()=>{if(bridgeWindow){clearInterval(timer);resolve()}else if(Date.now()-started>30000){clearInterval(timer);frame.remove();bridgePromise=null;reject(Error('تعذّر الاتصال بجدولك. افتح رابط الاتصال بحساب Google، ثم ارجع وأعد المحاولة.'))}},100)});return bridgePromise}
async function rpc(name,payload){await connectBridge();return new Promise((resolve,reject)=>{const id=crypto.randomUUID();const timer=setTimeout(()=>{pending.delete(id);reject(Error(name==='getState'?'تأخرت قراءة البيانات. أعد المحاولة.':'لم يصل تأكيد الحفظ. حدّث البيانات للتحقق قبل تكرار العملية.'))},45000);pending.set(id,{resolve,reject,timer});bridgeWindow.postMessage({type:'dftr:request',channel,id,method:name,payload},bridgeOrigin)})}
function applyState(next){data=next;loaded=true;const prev=$('filterBranch').value;$('filterBranch').innerHTML='<option value="">كل الفروع</option>'+data.branches.map(b=>'<option value="'+esc(b.name)+'">'+esc(b.name)+'</option>').join('');$('filterBranch').value=prev;const syncTime=new Date(data.updated).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});$('syncNote').innerHTML='<span class="status-dot"></span>آخر قراءة من الجدول: '+esc(syncTime)+' · <button class="inline-link" onclick="refresh()">تحديث الآن</button>';$('addTop').disabled=false;}
function setBusy(flag){busy=flag;document.querySelectorAll('button,input,select,textarea').forEach(el=>{if(flag){el.dataset.beforeDisabled=String(el.disabled);el.disabled=true;}else if(el.dataset.beforeDisabled!==undefined){el.disabled=el.dataset.beforeDisabled==='true';delete el.dataset.beforeDisabled;}});if(!flag)$('addTop').disabled=!loaded;}
async function refresh(){if(busy)return;setBusy(true);$('error').hidden=true;try{applyState(await rpc('getState'));render();}catch(e){showError(e);if(!loaded)$('main').innerHTML='<section class="panel empty"><h2>تعذّر تحميل الجدول</h2><p>تأكد من اتصالك وصلاحية الوصول، ثم أعد المحاولة.</p><p><a href="https://script.google.com/macros/s/AKfycbz-t9KSyd038rxInmJp5eT1MStT3mI0YJIKj3eenyLnq97tkGMnCbDUA3JfZrKt8Pt5rA/exec" target="_blank" rel="noopener">فتح الاتصال بحساب Google ↗</a></p><button class="btn primary" onclick="refresh()">إعادة المحاولة</button></section>';}finally{setBusy(false);}}
function closeDialog(){if(busy)return;$('dialog').close();confirmAction=null}
function ask(title,body,button,action,danger=false){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialogConfirm').textContent=button;$('dialogConfirm').className='btn '+(danger?'danger':'primary');confirmAction=action;$('dialog').showModal();}
$('dialogConfirm').onclick=()=>{if(confirmAction&&!busy)confirmAction()};$('dialog').addEventListener('cancel',e=>{if(busy)e.preventDefault()});
function navigate(next){if(busy)return;if(dirty&&view==='new'&&next!=='new'){ask('ترك التعديلات؟','<p>لم تُحفظ التعديلات الحالية. هل تريد تركها؟</p>','ترك التعديلات',()=>{dirty=false;closeDialog();navigate(next)});return}view=next;render();window.scrollTo({top:0,behavior:'instant'});}
function newRecord(){if(!loaded||busy)return;if(dirty){ask('بدء سجل جديد؟','<p>ستفقد التعديلات غير المحفوظة.</p>','بدء سجل',()=>{dirty=false;closeDialog();newRecord()});return}draft={id:uid(),create:true,date:today(),branch:data.branches.length===1?data.branches[0].name:'',amounts:Array(13).fill(0),notes:''};navigate('new');}
function editRecord(id){const r=data.records.find(x=>x.id===id);if(!r)return;draft={...r,create:false,amounts:[...r.amounts]};dirty=false;navigate('new')}
function selectedRecords(includeDeleted=false){const branch=$('filterBranch').value,from=$('filterFrom').value,to=$('filterTo').value;if(from&&to&&from>to)return [];return data.records.filter(r=>(includeDeleted?!!r.deleted:!r.deleted)&&(!branch||r.branch===branch)&&(!from||r.date>=from)&&(!to||r.date<=to)).sort((a,b)=>b.date.localeCompare(a.date)||b.updated.localeCompare(a.updated));}
function clearFilters(){$('filterBranch').value='';$('filterFrom').value='';$('filterTo').value='';render()}

function render(){if(!loaded)return;const titles={overview:['نظرة على الأرقام','كل مصاريفك، بمكان واحد.'],records:['الأرشيف والمتابعة','سجلات المصاريف'],new:['إدخال المصاريف',draft&&!draft.create?'تعديل السجل':'سجل جديد'],branches:['تنظيم العمل','إدارة الفروع']};$('eyebrow').textContent=titles[view][0];$('pageTitle').textContent=titles[view][1];document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('filters').hidden=!['overview','records'].includes(view);if(view==='overview')renderOverview();else if(view==='records')renderRecords();else if(view==='branches')renderBranches();else renderForm();if(['overview','records'].includes(view)&&$('filterFrom').value&&$('filterTo').value&&$('filterFrom').value>$('filterTo').value){showError(Error('تاريخ البداية يجب أن يسبق تاريخ النهاية.'));}}
function renderOverview(){const rows=selectedRecords(),sum=rows.reduce((s,r)=>s+r.total,0),count=new Set(rows.map(r=>r.branch)).size;let html='<section class="summary"><article class="total"><p>إجمالي المصاريف للفترة المحددة</p><strong><bdi>'+money(sum)+'</bdi></strong><small>'+rows.length+' سجل · المبالغ بالشيكل</small></article><article class="metric"><span>السجلات</span><strong>'+rows.length+'</strong><small>ضمن التصفية الحالية</small></article><article class="metric"><span>الفروع المسجلة</span><strong>'+data.branches.length+'</strong><small>'+count+' فروع لها مصاريف بالفترة</small></article></section>';
 if(!rows.length){html+=empty(data.records.some(r=>!r.deleted)?'لا توجد نتائج لهذه الفترة':'دفترك جاهز للبداية','اختر الفرع والتاريخ، وأدخل المصاريف حسب بنود جدولك.','<button class="btn primary" onclick="newRecord()">＋ إضافة سجل</button>');}else{const totals=labels.map((label,i)=>({label,total:rows.reduce((s,r)=>s+r.amounts[i],0)})).filter(x=>x.total>0).sort((a,b)=>b.total-a.total),branches=[...new Set(rows.map(r=>r.branch))].map(label=>({label,total:rows.filter(r=>r.branch===label).reduce((s,r)=>s+r.total,0)})).sort((a,b)=>b.total-a.total);html+='<div class="notice">أعلى بند صرفاً: <b>'+esc(totals[0]?.label||'—')+'</b> · '+(sum?Math.round((totals[0]?.total||0)/sum*100):0)+'٪ من الإجمالي.</div><div class="columns"><section class="panel"><div class="panel-head"><h2>توزيع المصاريف</h2></div>'+bars(totals.slice(0,6),sum)+'<p class="chart-foot">أكبر 6 بنود في الفترة المحددة</p></section><section class="panel"><div class="panel-head"><h2>المصاريف حسب الفرع</h2></div>'+bars(branches,sum)+'</section></div><section class="panel"><div class="panel-head"><h2>أحدث السجلات</h2><button class="btn quiet" onclick="navigate(\'records\')">عرض الكل ←</button></div>'+rows.slice(0,3).map(recordCard).join('')+'</section>';}$('main').innerHTML=html;}
function bars(items,sum){return '<div class="bars">'+items.map(x=>'<div><div class="bar-label"><span>'+esc(x.label)+'</span><bdi>'+money(x.total)+'</bdi></div><div class="bar-track" role="img" aria-label="'+esc(x.label+': '+money(x.total))+'"><div class="bar-fill" style="width:'+(sum?Math.min(100,x.total/sum*100):0)+'%"></div></div></div>').join('')+'</div>'}
function recordCard(r){return '<article class="record"><div class="record-top"><div><b>'+esc(r.branch)+'</b><div class="record-meta"><bdi>'+esc(r.date)+'</bdi> · '+r.amounts.filter(n=>n>0).length+' بنود</div></div><bdi class="record-total">'+money(r.total)+'</bdi></div><div class="record-chips">'+r.amounts.map((n,i)=>n?'<span class="chip">'+esc(labels[i])+': <bdi>'+money(n)+'</bdi></span>':'').join('')+'</div>'+(r.notes?'<p class="record-note">'+esc(r.notes)+'</p>':'')+'<div class="actions">'+(r.deleted?'<button class="btn" onclick="restoreRecord('+esc(JSON.stringify(r.id))+')">↶ استرجاع</button>':'<button class="btn" onclick="editRecord('+esc(JSON.stringify(r.id))+')">عرض / تعديل</button><button class="btn danger" onclick="deleteRecord('+esc(JSON.stringify(r.id))+')">حذف</button>')+'</div></article>'}
function renderRecords(){const rows=selectedRecords(trash).filter(r=>(r.branch+' '+r.notes+' '+r.date).toLowerCase().includes(search.toLowerCase()));$('main').innerHTML='<div class="toolbar"><div class="segmented"><button class="btn '+(!trash?'selected':'')+'" onclick="trash=false;renderRecords()">السجلات</button><button class="btn '+(trash?'selected':'')+'" onclick="trash=true;renderRecords()">المحذوفات</button></div><button class="btn" onclick="exportCsv()">↓ تصدير CSV</button></div><div class="toolbar"><input class="search" id="search" aria-label="بحث بالسجلات" placeholder="ابحث باسم الفرع أو الملاحظات…" value="'+esc(search)+'"><span class="muted">'+rows.length+' سجل</span></div>'+(trash?'<p class="notice">السجلات المحذوفة محفوظة للاسترجاع، ولا تدخل في ملخص المصاريف أو التصدير.</p>':'')+(rows.length?'<section class="panel">'+rows.map(recordCard).join('')+'</section>':empty('لا توجد سجلات مطابقة','غيّر التصفية أو أضف سجل مصاريف جديد.'));$('search').oninput=e=>{search=e.target.value;const pos=e.target.selectionStart;renderRecords();$('search').focus();$('search').setSelectionRange(pos,pos);};}
function renderForm(){if(!draft){newRecord();return}const groups=[['المشتريات',[0,1,6]],['التشغيل والموظفون',[2,3,4,7,12]],['الضرائب والالتزامات',[5,8,9,10,11]]];$('main').innerHTML='<form id="recordForm"><section class="panel"><h2>بيانات السجل</h2><div class="form-grid"><label>التاريخ<input id="recordDate" type="date" required value="'+esc(draft.date)+'"></label><label>الفرع<select id="recordBranch" required><option value="">اختر الفرع</option>'+data.branches.map(b=>'<option '+(b.name===draft.branch?'selected':'')+' value="'+esc(b.name)+'">'+esc(b.name)+'</option>').join('')+'</select></label></div>'+(!data.branches.length?'<p class="notice">أضف فرعك أولاً من شاشة <button type="button" class="inline-link" onclick="navigate(\'branches\')">الفروع</button>.</p>':'')+'<p class="muted">جميع المبالغ بالشيكل. اترك البنود غير المستخدمة فارغة.</p></section>'+groups.map((g,j)=>'<section class="panel"><div class="group-heading"><span class="group-number">'+(j+1)+'</span><h2>'+g[0]+'</h2></div><div class="expense-grid">'+g[1].map(i=>'<label>'+esc(labels[i])+'<input data-amount="'+i+'" inputmode="decimal" type="number" min="0" max="100000000" step="0.01" placeholder="0.00" value="'+(draft.amounts[i]?draft.amounts[i]/100:'')+'"><span class="field-help">'+(labels[i]!==originals[i]?esc(originals[i]):'')+'</span></label>').join('')+'</div></section>').join('')+'<section class="panel"><label>ملاحظات اختيارية<textarea id="recordNotes" maxlength="1000" rows="3" placeholder="تفاصيل تساعدك على مراجعة السجل لاحقاً">'+esc(draft.notes)+'</textarea></label></section><div class="save-bar"><div><small>المجموع التلقائي</small><strong id="formTotal"><bdi>'+money(draft.amounts.reduce((a,b)=>a+b,0))+'</bdi></strong></div><div class="actions"><button type="button" class="btn" onclick="navigate(\'records\')">إلغاء</button><button class="btn primary" type="submit">حفظ السجل ✓</button></div></div></form>';
 $('recordForm').oninput=()=>{dirty=true;readForm();$('formTotal').innerHTML='<bdi>'+money(draft.amounts.reduce((a,b)=>a+b,0))+'</bdi>';};$('recordForm').onsubmit=e=>{e.preventDefault();saveDraft()};}
function readForm(){draft.date=$('recordDate').value;draft.branch=$('recordBranch').value;draft.notes=$('recordNotes').value;document.querySelectorAll('[data-amount]').forEach(el=>draft.amounts[Number(el.dataset.amount)]=Math.round(Number(el.value||0)*100));}
async function saveDraft(){if(busy)return;readForm();if(!draft.amounts.some(n=>n>0)){showError(Error('أدخل مبلغاً في بند واحد على الأقل.'));return}const payload={...draft,amounts:[...draft.amounts]};setBusy(true);$('error').hidden=true;try{applyState(await rpc('saveRecord',payload));dirty=false;draft=null;view='records';trash=false;search='';render();window.scrollTo(0,0);toast('تم حفظ السجل في Google Sheets');}catch(e){showError(e);window.scrollTo(0,0);}finally{setBusy(false)}}
async function mutate(name,payload,success){if(busy)return;setBusy(true);$('error').hidden=true;try{applyState(await rpc(name,payload));$('dialog').close();confirmAction=null;render();toast(success);}catch(e){showError(e);$('dialog').close();window.scrollTo(0,0);}finally{setBusy(false)}}
function deleteRecord(id){const r=data.records.find(x=>x.id===id);if(!r)return;ask('نقل السجل إلى المحذوفات؟','<p>'+esc(r.branch)+' · '+esc(r.date)+'<br><bdi>'+money(r.total)+'</bdi><br>يمكن استرجاعه لاحقاً. سيُستبعد من الملخصات.</p>','نقل إلى المحذوفات',()=>mutate('setDeleted',{id:r.id,fingerprint:r.fingerprint,deleted:true},'تم نقل السجل إلى المحذوفات'),true)}
function restoreRecord(id){const r=data.records.find(x=>x.id===id);if(r)mutate('setDeleted',{id:r.id,fingerprint:r.fingerprint,deleted:false},'تم استرجاع السجل')}
function renderBranches(){$('main').innerHTML='<section class="panel"><div class="panel-head"><h2>فروعك <span class="muted">('+data.branches.length+')</span></h2><button class="btn primary" onclick="branchDialog()">＋ إضافة فرع</button></div>'+(data.branches.length?data.branches.map(b=>'<div class="branch-row"><div><b class="branch-name">'+esc(b.name)+'</b><div class="record-meta">'+data.records.filter(r=>r.branch===b.name&&!r.deleted).length+' سجلات نشطة</div></div><div class="actions"><button class="btn" onclick="branchDialog('+esc(JSON.stringify(b.id))+')">تعديل الاسم</button><button class="btn danger" onclick="deleteBranch('+esc(JSON.stringify(b.id))+')">حذف</button></div></div>').join(''):'<div class="empty"><div class="empty-symbol">⌂</div><h2>أضف فرعك الأول</h2><p>استخدم أسماء واضحة حتى يسهل اختيار الفرع ومقارنة مصاريفه.</p></div>')+'</section><div class="notice wide-note">تعديل اسم الفرع ينعكس على سجلاته. لا يمكن حذف فرع مرتبط بسجلات محفوظة.</div><section class="panel"><h2>الربط مع جدولك</h2><p class="muted">تُحفظ المبالغ في الأعمدة الأصلية. يضيف التطبيق أعمدة تعريف وحالة وملاحظات بعد «المجموع»، وورقة مستقلة لقائمة الفروع. عند مراجعة الجدول، استبعد الصفوف التي لها تاريخ في عمود «محذوف بتاريخ».</p></section>';}
function branchDialog(id){const b=data.branches.find(x=>x.id===id);ask(b?'تعديل اسم الفرع':'إضافة فرع','<label>اسم الفرع<input id="branchName" maxlength="100" value="'+esc(b?.name||'')+'" placeholder="مثال: الفرع الرئيسي"></label>','حفظ الفرع',()=>{const name=$('branchName').value.trim();if(!name){$('branchName').focus();return}mutate('saveBranch',{id:b?.id,name,previousName:b?.name},'تم حفظ الفرع')});$('branchName').focus();$('branchName').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('dialogConfirm').click()}};}
function deleteBranch(id){const b=data.branches.find(x=>x.id===id);if(!b)return;if(data.records.some(r=>r.branch===b.name)){showError(Error('هذا الفرع مرتبط بسجلات. يمكنك تغيير اسمه، ولا يمكن حذفه.'));return}ask('حذف الفرع؟','<p>سيُحذف '+esc(b.name)+' من قائمة الفروع.</p>','حذف الفرع',()=>mutate('removeBranch',b,'تم حذف الفرع'),true)}
function exportCsv(){const rows=selectedRecords(false).filter(r=>(r.branch+' '+r.notes+' '+r.date).toLowerCase().includes(search.toLowerCase()));if(!rows.length){toast('لا توجد سجلات نشطة للتصدير ضمن التصفية.');return}const safe=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"',header=['تاريخ','اسم الفرع',...originals,'المجموع'];const text='\uFEFF'+[header,...rows.map(r=>[r.date,r.branch,...r.amounts.map(n=>(n/100).toFixed(2)),(r.total/100).toFixed(2)])].map(r=>r.map(safe).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='مصاريف-الفروع-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('تم تجهيز تصدير السجلات النشطة')}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});refresh();
</script></body></html>
