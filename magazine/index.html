<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAD PARFUMEUR — פרופיל חברה</title>
<meta name="description" content="MAD PARFUMEUR — בית בשמי נישה בינלאומי. פרופיל חברה רשמי.">
<meta property="og:title" content="MAD PARFUMEUR — פרופיל חברה">
<meta property="og:image" content="https://www.mad-parfumeur.com/magazine/p01.jpg">
<link rel="icon" href="../logo.png">
<style>
:root{--bg:#0d0d0d;--fg:#f3efe7;--gold:#c9a96e;--muted:#9a948a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:rgba(13,13,13,.9);backdrop-filter:blur(8px);border-bottom:1px solid #222}
header img{height:34px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--gold);color:var(--gold);background:none;padding:8px 14px;border-radius:999px;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--gold);color:#111}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.page{margin:0 0 18px;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:zoom-in;background:#1a1a1a;aspect-ratio:1800/1273}
.page img{display:block;width:100%;height:100%;object-fit:cover}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 16px}
footer a{color:var(--gold)}
#viewer{position:fixed;inset:0;background:#000;z-index:10;display:none;align-items:center;justify-content:center}
#viewer.on{display:flex}
#viewer img{max-width:100vw;max-height:100vh;object-fit:contain;user-select:none}
.nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);border:none;color:#fff;font-size:34px;width:52px;height:72px;cursor:pointer;border-radius:8px}
.prev{right:10px}.next{left:10px}
.close{position:fixed;top:12px;left:12px;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:22px;width:44px;height:44px;border-radius:50%;cursor:pointer}
.count{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;background:rgba(0,0,0,.65);padding:4px 12px;border-radius:999px}
@media (max-width:600px){.nav{width:40px;height:56px;font-size:26px}header img{height:28px}.btn{padding:7px 11px;font-size:13px}}
</style>
</head>
<body>
<header>
  <a href="https://madperfumeur.co.il"><img src="../logo.png" alt="MAD PARFUMEUR"></a>
  <div class="btns">
    <button class="btn solid" onclick="openV(0)">📖 קריאה במסך מלא</button>
    <a class="btn" href="MAD-Parfumeur-Profile.pdf" download>⬇ הורדת PDF</a>
  </div>
</header>
<main id="pages"></main>
<footer>MAD PARFUMEUR · <a href="https://madperfumeur.co.il">madperfumeur.co.il</a></footer>

<div id="viewer">
  <img id="vimg" alt="">
  <button class="nav prev" onclick="go(-1)" aria-label="הקודם">›</button>
  <button class="nav next" onclick="go(1)" aria-label="הבא">‹</button>
  <button class="close" onclick="closeV()" aria-label="סגור">✕</button>
  <div class="count" id="count" dir="ltr"></div>
</div>

<script>
const N=21, src=i=>'p'+String(i+1).padStart(2,'0')+'.jpg';
const wrap=document.getElementById('pages');
for(let i=0;i<N;i++){const d=document.createElement('div');d.className='page';d.onclick=()=>openV(i);
 const im=document.createElement('img');im.src=src(i);im.alt='עמוד '+(i+1);if(i>1)im.loading='lazy';d.appendChild(im);wrap.appendChild(d);}
let cur=0;const V=document.getElementById('viewer'),VI=document.getElementById('vimg'),C=document.getElementById('count');
function show(){VI.src=src(cur);C.textContent=(cur+1)+' / '+N;[cur-1,cur+1].forEach(j=>{if(j>=0&&j<N){new Image().src=src(j)}})}
function openV(i){cur=i;show();V.classList.add('on');document.body.style.overflow='hidden'}
function closeV(){V.classList.remove('on');document.body.style.overflow=''}
function go(d){cur=Math.min(N-1,Math.max(0,cur+d));show()}
document.addEventListener('keydown',e=>{if(!V.classList.contains('on'))return;if(e.key==='Escape')closeV();if(e.key==='ArrowLeft')go(1);if(e.key==='ArrowRight')go(-1)});
let sx=null;V.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
V.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(dx>0?1:-1);sx=null});
VI.addEventListener('click',e=>{const r=VI.getBoundingClientRect();go(e.clientX<r.left+r.width/2?1:-1)});
</script>
</body>
</html>
