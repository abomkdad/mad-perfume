<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d0b">
<title>MAD | إدارة الموظفين</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAD الموظفين">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d0b; --bg2:#15130f; --card:#1c1a16; --card2:#24211b; --line:#2f2b23;
  --gold:#d4af6a; --gold2:#b8914a; --gold-soft:rgba(212,175,106,.14);
  --text:#f3eee4; --muted:#a39b8b; --faint:#6e675a;
  --green:#5cc98a; --red:#ef6b6b; --amber:#f0b44c;
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,-apple-system,sans-serif;font-size:16px;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.hidden{display:none!important}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,rgba(14,13,11,.0));padding:calc(12px + var(--safe-t)) 16px 10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1408;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px}
.brand h1{margin:0;font-size:18px;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px;stroke:var(--text)}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding:4px 16px calc(96px + var(--safe-b))}
.view{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Date nav ---------- */
.datenav{display:flex;align-items:center;gap:8px;margin:6px 0 14px}
.datenav .icon-btn{flex:none}
.date-pill{flex:1;position:relative;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
.date-pill small{color:var(--gold);font-weight:500}
.date-pill input{position:absolute;inset:0;opacity:0;width:100%;height:100%}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi.hero{grid-column:1/-1;background:linear-gradient(135deg,#2a2213,#1c1a16 60%);border-color:#3d3322}
.kpi label{display:block;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.kpi b{font-size:20px;font-weight:800}
.kpi.hero b{font-size:30px;color:var(--gold)}
.kpi .sub{color:var(--faint);font-size:12px;margin-top:2px}

.sec-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.sec-title h2{margin:0;font-size:16px;font-weight:800}
.sec-title span{color:var(--muted);font-size:13px}

/* ---------- Entry cards ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:block;width:100%;text-align:right}
.entry:active{background:var(--card2)}
.entry-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:800;flex:none}
.who b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--muted);font-size:12px}
.amt{font-weight:800;font-size:18px;color:var(--gold);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--text);font-weight:700}
.chip.good b{color:var(--green)} .chip.bad b{color:var(--red)} .chip.mid b{color:var(--amber)}
.rank{width:26px;text-align:center;font-weight:800;color:var(--faint);flex:none}
.rank.r1{color:#f5cf6b}.rank.r2{color:#cfd4dc}.rank.r3{color:#d9955a}
.bar{height:6px;background:var(--bg2);border-radius:6px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:6px}

.missing{display:flex;flex-wrap:wrap;gap:8px}
.mbtn{background:var(--bg2);border:1px dashed #4a4336;border-radius:999px;padding:7px 12px;font-size:14px;color:var(--muted)}
.mbtn:active{background:var(--gold-soft);color:var(--gold)}

.empty{text-align:center;color:var(--muted);padding:28px 16px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

/* ---------- Segmented ---------- */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin:6px 0 12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;padding:9px 10px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500}
.seg button.on{background:var(--gold);color:#1a1408;font-weight:800}
.seg.small button{padding:7px 8px;font-size:13px}

/* ---------- Chart ---------- */
.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px}
.chart svg{display:block;width:100%;height:auto}
.chart .cap{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding:0 4px 6px}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(21,19,15,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:11.5px;font-weight:500}
.nav button svg{width:23px;height:23px;stroke:currentColor}
.nav button.on{color:var(--gold)}
.fab{position:fixed;left:18px;bottom:calc(78px + var(--safe-b));z-index:31;width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 10px 28px rgba(212,175,106,.35);display:grid;place-items:center}
.fab svg{width:28px;height:28px;stroke:#1a1408}

/* ---------- Sheet (modal) ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--line);max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s}
.sheet.on{transform:none;visibility:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet-h{padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.sheet-h::before{content:'';position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:#3a352b}
.sheet-h h3{margin:8px 0 0;font-size:18px;font-weight:800}
.sheet-b{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:10px}

.field{margin-bottom:14px}
.field>label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.inp{width:100%;height:50px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);padding:0 14px;font-size:18px;font-weight:700;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--gold)}
.inp.err{border-color:var(--red)}
.inp[type=date]{font-size:16px}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:18px 22px,24px 22px;background-size:6px 6px;background-repeat:no-repeat}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:50px;height:50px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:24px;font-weight:700;flex:none}
.stepper button:active{background:var(--gold-soft)}
.stepper .inp{text-align:center}
.hint{font-size:12.5px;color:var(--red);margin-top:6px;min-height:0}
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.preview div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.preview small{display:block;color:var(--muted);font-size:11.5px}
.preview b{font-size:16px;color:var(--gold)}

.name-grid{display:flex;flex-wrap:wrap;gap:8px;max-height:176px;overflow-y:auto;padding:2px}
.name-grid button{padding:9px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:15px;font-weight:500}
.name-grid button.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);font-weight:800}
.name-grid button.done{opacity:.45}
.search{margin-bottom:8px;height:42px;font-size:15px;font-weight:500}

.btn{flex:1;height:52px;border-radius:14px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1408}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.danger{background:rgba(239,107,107,.12);color:var(--red);border:1px solid rgba(239,107,107,.3);flex:0 0 auto;padding:0 18px}
.btn:disabled{opacity:.55}

/* ---------- Toast ---------- */
.toast{position:fixed;top:calc(14px + var(--safe-t));left:16px;right:16px;z-index:90;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.45);transform:translateY(-140%);transition:transform .25s}
.toast.on{transform:none}
.toast.ok{border-color:rgba(92,201,138,.5)} .toast.bad{border-color:rgba(239,107,107,.6);color:#ffd2d2}

/* ---------- Login ---------- */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.login .logo{width:74px;height:74px;border-radius:22px;font-size:22px;margin-bottom:16px}
.login h1{margin:0 0 4px;font-size:24px}
.login p{margin:0 0 26px;color:var(--muted)}
.pin{display:flex;gap:12px;justify-content:center;margin-bottom:22px;direction:ltr}
.pin i{width:15px;height:15px;border-radius:50%;border:2px solid var(--gold2)}
.pin i.f{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr}
.pad button{height:64px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:26px;font-weight:700}
.pad button:active{background:var(--gold-soft)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:80}
.loader{width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}

.set-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;width:100%;text-align:right;font-weight:600}
.set-item small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:2px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(92,201,138,.12);color:var(--green);white-space:nowrap}
.tag.off{background:rgba(239,107,107,.12);color:var(--red)}
.row-flex{display:flex;gap:8px}
.row-flex .inp{flex:1}
.row-flex .btn{flex:0 0 auto;padding:0 18px;height:50px}
.note{font-size:12.5px;color:var(--faint);margin-top:6px;line-height:1.6}
</style>
</head>
<body>

<div id="loading" class="loading"><div class="loader"></div></div>

<!-- ============ LOGIN ============ -->
<section id="login" class="login hidden">
  <div class="logo">MAD</div>
  <h1>إدارة الموظفين</h1>
  <p>أدخل رمز الدخول</p>
  <div class="pin" id="pinDots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
  <p id="loginMsg" style="margin:18px 0 0;min-height:22px;color:var(--muted);font-size:14px"></p>
</section>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <div class="logo">MAD</div>
        <div><h1 id="title">اليوم</h1><small id="subtitle">MAD Parfum</small></div>
      </div>
      <button class="icon-btn" id="refreshBtn" aria-label="تحديث">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- TODAY -->
    <section class="view" id="v-day">
      <div class="datenav">
        <button class="icon-btn" id="dayPrev" aria-label="اليوم السابق"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <label class="date-pill"><span id="dayLabel"></span><small id="dayRel"></small><input type="date" id="dayInput"></label>
        <button class="icon-btn" id="dayNext" aria-label="اليوم التالي"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      </div>
      <div class="kpis" id="dayKpis"></div>
      <div id="dayMissingWrap">
        <div class="sec-title"><h2>لم يُسجَّل لهم</h2><span id="missCount"></span></div>
        <div class="missing" id="dayMissing"></div>
      </div>
      <div class="sec-title"><h2>سجلات اليوم</h2><span id="dayCount"></span></div>
      <div class="list" id="dayList"></div>
    </section>

    <!-- STAFF -->
    <section class="view hidden" id="v-staff">
      <div class="seg" id="staffPeriod"></div>
      <div class="seg small" id="staffMetric"></div>
      <div class="list" id="staffList"></div>
    </section>

    <!-- REPORTS -->
    <section class="view hidden" id="v-rep">
      <div class="seg" id="repPeriod"></div>
      <div class="kpis" id="repKpis"></div>
      <div class="sec-title"><h2>المبيعات اليومية</h2><span id="repChartCap"></span></div>
      <div class="chart" id="repChart"></div>
      <div class="sec-title"><h2>أفضل الموظفين</h2><span>حسب المبلغ</span></div>
      <div class="list" id="repTop"></div>
      <div class="sec-title"><h2>أعلى نسبة بيع</h2><span>بحد أدنى 3 أيام</span></div>
      <div class="list" id="repConv"></div>
    </section>

    <!-- SETTINGS -->
    <section class="view hidden" id="v-set">
      <div class="sec-title"><h2>الموظفون</h2><span id="empCount"></span></div>
      <div class="field row-flex">
        <input class="inp" id="newEmp" placeholder="اسم موظف جديد" maxlength="40" style="font-size:16px;font-weight:500">
        <button class="btn primary" id="addEmpBtn">إضافة</button>
      </div>
      <div id="empList"></div>
      <div class="sec-title"><h2>الأمان</h2></div>
      <div class="field row-flex">
        <input class="inp num" id="newPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="رمز جديد (4-8 أرقام)" style="font-size:16px;font-weight:500;text-align:right">
        <button class="btn primary" id="pinBtn">تغيير</button>
      </div>
      <a class="set-item" id="sheetLink" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">
        <div>فتح جدول البيانات<small>Google Sheets — المبيعات</small></div><span>↗</span>
      </a>
      <button class="set-item" id="logoutBtn" style="color:var(--red)"><div>تسجيل الخروج</div><span>⎋</span></button>
      <p class="note" id="fixNote"></p>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="إضافة سجل"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="nav" id="nav">
    <button data-v="day" class="on"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>اليوم</button>
    <button data-v="staff"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.6c2.3.3 3.9 1.9 4.5 4.4"/></svg>الموظفين</button>
    <button data-v="rep"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التقارير</button>
    <button data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>الإعدادات</button>
  </nav>
</div>

<!-- ============ SHEETS ============ -->
<div class="overlay" id="overlay"></div>

<div class="sheet" id="entrySheet" role="dialog" aria-modal="true">
  <div class="sheet-h"><h3 id="entryTitle">سجل جديد</h3><button class="icon-btn" data-close aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sheet-b">
    <div class="field"><label>التاريخ</label><input class="inp" type="date" id="fDate"></div>
    <div class="field">
      <label>الموظف <span id="fNameSel" style="color:var(--gold)"></span></label>
      <input class="inp search" id="fSearch" placeholder="ابحث أو اكتب اسماً جديداً">
      <div class="name-grid" id="fNames"></div>
      <div class="hint" id="hName"></div>
    </div>

<script>
(function(){
'use strict';
/* ================= API ================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbwZeolHAxhUkdvdiyZgwcy4kLGFv3f5LwxnI5P_KseZw1Ytr4zHco8N59QbJybKC7hhTQ/exec';
var seq=0;
function jsonp(fn,args,tries){
  tries = tries||0;
  return new Promise(function(res,rej){
    var cb='__mad'+Date.now().toString(36)+(seq++), s=document.createElement('script'), done=false;
    var to=setTimeout(function(){ finish(new Error('timeout')); }, 40000);
    function finish(err,val){
      if(done) return; done=true; clearTimeout(to);
      window[cb]=function(){}; if(s.parentNode) s.parentNode.removeChild(s);
      if(err) rej(err); else res(val);
    }
    window[cb]=function(j){ if(!j||!j.ok) finish(new Error((j&&j.error)||'حدث خطأ في الخادم')); else finish(null,j.result); };
    s.onerror=function(){ finish(new Error('net')); };
    s.async=true;
    s.src=API_URL+'?fn='+encodeURIComponent(fn)+'&args='+encodeURIComponent(JSON.stringify(args))+'&cb='+cb+'&_='+Date.now();
    document.head.appendChild(s);
  }).catch(function(e){
    if((e.message==='net'||e.message==='timeout') && tries<1 && (fn==='apiLoad'||fn==='apiLogin')) return jsonp(fn,args,tries+1);
    if(e.message==='net') throw new Error('تعذّر الاتصال بالخادم، تأكد من الإنترنت');
    if(e.message==='timeout') throw new Error('انتهت مهلة الاتصال، حاول مرة أخرى');
    throw e;
  });
}
function call(fn){
  var args = Array.prototype.slice.call(arguments,1);
  if (/^https:\/\/script\.google\.com\//.test(API_URL)) return jsonp(fn,args);
  return new Promise(function(res,rej){
    if (window.google && google.script && google.script.run){
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(e && e.message ? e : new Error(String(e))); });
      r[fn].apply(r,args);
    } else if (window.MOCK_API && window.MOCK_API[fn]) {
      setTimeout(function(){ try{ res(window.MOCK_API[fn].apply(null,args)); }catch(e){ rej(e); } }, 150);
    } else rej(new Error('لا يوجد اتصال بالخادم'));
  });
}
function errMsg(e){
  var m = (e && e.message) || String(e || '');
  m = m.replace(/^Exception:\s*/,'').replace(/^Error:\s*/,'');
  if (/NetworkError|network|Failed to fetch/i.test(m)) return 'تعذّر الاتصال، تأكد من الإنترنت';
  return m || 'حدث خطأ غير متوقع';
}

/* ================= STORAGE ================= */
function sget(k){ try{ return localStorage.getItem('madstaff_'+k); }catch(e){ return null; } }
function sset(k,v){ try{ if (v===null) localStorage.removeItem('madstaff_'+k); else localStorage.setItem('madstaff_'+k,v); }catch(e){} }

/* ================= STATE ================= */
var S = { pin: sget('pin') || '', data: null, view: 'day', day: null, staffP: 'month', staffM: 'amount', repP: 'month', editing: null };
var $ = function(id){ return document.getElementById(id); };

/* ================= HELPERS ================= */
var MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pd(iso){ var p=iso.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function toIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(iso,n){ var d=pd(iso); d.setDate(d.getDate()+n); return toIso(d); }
function fmtDay(iso){ var d=pd(iso); return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]; }
function fmtShort(iso){ var d=pd(iso); return d.getDate()+'/'+(d.getMonth()+1); }
function money(n){ return '₪'+Math.round(n||0).toLocaleString('en-US'); }
function n1(n){ return (Math.round((n||0)*10)/10).toLocaleString('en-US'); }
function pct(n){ return Math.round((n||0)*100)+'%'; }
function today(){ return S.data ? S.data.today : toIso(new Date()); }
function initials(n){ return String(n||'?').trim().charAt(0); }
function convClass(c){ return c>=.85?'good':c>=.65?'mid':'bad'; }

function periodRange(p){
  var t = today(), d = pd(t);
  if (p==='today') return [t,t,'اليوم'];
  if (p==='week'){ var s=new Date(d); s.setDate(d.getDate()-d.getDay()); return [toIso(s),t,'هذا الأسبوع']; }
  if (p==='month'){ return [toIso(new Date(d.getFullYear(),d.getMonth(),1)),t,MONTHS[d.getMonth()]]; }
  if (p==='last'){ var a=new Date(d.getFullYear(),d.getMonth()-1,1), b=new Date(d.getFullYear(),d.getMonth(),0); return [toIso(a),toIso(b),MONTHS[a.getMonth()]]; }
  return ['0000-01-01','9999-12-31','الكل'];
}
var PERIODS = [['week','الأسبوع'],['month','هذا الشهر'],['last','الشهر الماضي'],['all','الكل']];

function inRange(r,a,b){ return r.date>=a && r.date<=b; }
function agg(rows){
  var t={amount:0,customers:0,sales:0,hours:0,n:rows.length,days:{}};
  rows.forEach(function(r){ t.amount+=r.amount; t.customers+=r.customers; t.sales+=r.sales; t.hours+=r.hours; t.days[r.date]=1; });
  t.nd = Object.keys(t.days).length;
  t.perHour = t.hours? t.amount/t.hours : 0;
  t.conv = t.customers? t.sales/t.customers : 0;
  t.perCust = t.sales? t.amount/t.sales : 0;
  return t;
}
function byEmployee(rows){
  var m={};
  rows.forEach(function(r){ (m[r.name]=m[r.name]||[]).push(r); });
  return Object.keys(m).map(function(k){ var a=agg(m[k]); a.name=k; a.rows=m[k]; return a; });
}

/* ================= UI BASICS ================= */
var toastT;
function toast(msg,type){
  var t=$('toast'); t.textContent=msg; t.className='toast on '+(type||'');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.className='toast'; }, type==='bad'?4200:2400);
}
var openSheet=null;
function showSheet(id){ if(openSheet) hideSheet(true); openSheet=$(id); $('overlay').classList.add('on'); openSheet.classList.add('on'); }
function hideSheet(keepOverlay){ if(openSheet) openSheet.classList.remove('on'); openSheet=null; if(!keepOverlay) $('overlay').classList.remove('on'); }
$('overlay').onclick=function(){ hideSheet(); };
document.querySelectorAll('[data-close]').forEach(function(b){ b.onclick=function(){ hideSheet(); }; });

function confirmBox(title,text,yesLabel){
  return new Promise(function(res){
    var prev = openSheet;
    $('cfTitle').textContent=title; $('cfText').textContent=text; $('cfYes').textContent=yesLabel||'تأكيد';
    showSheet('confirmSheet');
    $('cfYes').onclick=function(){ hideSheet(); res(true); };
    $('cfNo').onclick=function(){ hideSheet(); if(prev){ showSheet(prev.id); } res(false); };
  });
}

/* ================= LOGIN ================= */
var pinBuf='', busy=false;
function buildPad(){
  var keys=['1','2','3','4','5','6','7','8','9','⌫','0','✓'], pad=$('pad'); pad.innerHTML='';
  keys.forEach(function(k){
    var b=document.createElement('button'); b.textContent=k;
    if(k==='✓'){ b.style.background='linear-gradient(135deg,var(--gold),var(--gold2))'; b.style.color='#1a1408'; }
    b.onclick=function(){ padKey(k); };
    pad.appendChild(b);
  });
  drawDots();
}
function padKey(k){
  if(busy) return;
  if(k==='⌫') pinBuf=pinBuf.slice(0,-1);
  else if(k==='✓') return tryLogin();
  else if(pinBuf.length<8) pinBuf+=k;
  drawDots();
}
function drawDots(){
  var n=Math.max(4,pinBuf.length), h='';
  for(var i=0;i<n;i++) h+='<i class="'+(i<pinBuf.length?'f':'')+'"></i>';
  $('pinDots').innerHTML=h;
}
function tryLogin(){
  if(pinBuf.length<4){ toast('الرمز من 4 أرقام على الأقل','bad'); return; }
  var p=pinBuf; busy=true; $('pinDots').style.opacity=.5; $('loginMsg').textContent='جارٍ التحقق…';
  call('apiLogin',p).then(function(){ S.pin=p; sset('pin',p); pinBuf=''; $('login').classList.add('hidden'); load(true); })
  .catch(function(e){ pinBuf=''; drawDots(); $('pinDots').classList.remove('shake'); void $('pinDots').offsetWidth; $('pinDots').classList.add('shake'); toast(errMsg(e),'bad'); })
  .then(function(){ busy=false; $('pinDots').style.opacity=1; $('loginMsg').textContent=''; });
}
document.addEventListener('keydown',function(ev){
  if($('login').classList.contains('hidden')) return;
  if(/^\d$/.test(ev.key)) padKey(ev.key);
  else if(ev.key==='Backspace') padKey('⌫');
  else if(ev.key==='Enter') padKey('✓');
});
function showLogin(msg){
  $('loading').classList.add('hidden'); $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  pinBuf=''; buildPad(); if(msg) toast(msg,'bad');
}

/* ================= LOAD ================= */
function readCache(){ try{ var c=JSON.parse(sget('cache')||'null'); return c && c.entries ? c : null; }catch(e){ return null; } }
function load(first){
  var cached = first ? readCache() : null;
  if(cached){ setData(cached); $('loading').classList.add('hidden'); $('login').classList.add('hidden'); $('app').classList.remove('hidden'); }
  else if(first) $('loading').classList.remove('hidden');
  $('refreshBtn').classList.add('spin');
  return call('apiLoad',S.pin).then(function(d){
    setData(d);
    $('loading').classList.add('hidden'); $('app').classList.remove('hidden');
    if(!first) toast('تم التحديث','ok');
    else if(cached) { /* تحديث صامت */ }
  }).catch(function(e){
    var m=errMsg(e);
    if(/رمز الدخول/.test(m)){ sset('pin',null); sset('cache',null); S.pin=''; S.data=null; showLogin(first?'':m); }
    else { $('loading').classList.add('hidden'); if(S.data){ $('app').classList.remove('hidden'); } else { showLogin(); } toast(m,'bad'); }
  }).then(function(){ $('refreshBtn').classList.remove('spin'); });
}
function setData(d){
  d.entries.forEach(function(r){ r.name=String(r.name||'').trim(); });
  var prevToday = S.data && S.data.today;
  S.data=d; if(!S.day || S.day===prevToday) S.day=d.today;
  try{ sset('cache', JSON.stringify(d)); }catch(e){}
  render();
}
$('refreshBtn').onclick=function(){ load(false); };

/* ================= NAV ================= */
var TITLES={day:'اليوم',staff:'الموظفين',rep:'التقارير',set:'الإعدادات'};
$('nav').onclick=function(e){
  var b=e.target.closest('button'); if(!b) return;
  S.view=b.dataset.v;
  document.querySelectorAll('#nav button').forEach(function(x){ x.classList.toggle('on',x===b); });
  ['day','staff','rep','set'].forEach(function(v){ $('v-'+v).classList.toggle('hidden',v!==S.view); });
  $('title').textContent=TITLES[S.view];
  $('fab').classList.toggle('hidden', S.view==='set');
  window.scrollTo(0,0); render();
};

function render(){
  if(!S.data) return;
  var sub = S.data.entries.length+' سجل • '+S.data.employees.filter(function(e){return e.active;}).length+' موظف فعال';
  $('subtitle').textContent=sub;
  if(S.view==='day') renderDay();
  else if(S.view==='staff') renderStaff();
  else if(S.view==='rep') renderRep();
  else renderSet();
}

/* ================= DAY ================= */
$('dayPrev').onclick=function(){ S.day=addDays(S.day,-1); renderDay(); };
$('dayNext').onclick=function(){ if(S.day<today()){ S.day=addDays(S.day,1); renderDay(); } };
$('dayInput').onchange=function(){ if(this.value){ S.day=this.value>today()?today():this.value; renderDay(); } };

function kpiHtml(t,label){
  return '<div class="kpi hero"><label>'+esc(label)+'</label><b class="num">'+money(t.amount)+'</b><div class="sub">'+t.sales+' مبيعة من '+t.customers+' زبون</div></div>'+
    '<div class="kpi"><label>نسبة المبيعات</label><b class="num">'+pct(t.conv)+'</b></div>'+
    '<div class="kpi"><label>معدل الزبون</label><b class="num">'+money(t.perCust)+'</b></div>'+
    '<div class="kpi"><label>البيع بالساعة</label><b class="num">'+money(t.perHour)+'</b></div>'+
    '<div class="kpi"><label>ساعات العمل</label><b class="num">'+n1(t.hours)+'</b><div class="sub">'+t.n+' سجل</div></div>';
}
function entryCard(r){
  var ph=r.hours?r.amount/r.hours:0, cv=r.customers?r.sales/r.customers:0, pc=r.sales?r.amount/r.sales:0;
  return '<button class="entry" data-row="'+r.row+'"><div class="entry-h"><div class="who"><div class="av">'+esc(initials(r.name))+'</div><div><b>'+esc(r.name)+'</b><small>'+n1(r.hours)+' ساعات</small></div></div><div class="amt num">'+money(r.amount)+'</div></div>'+
    '<div class="chips"><span class="chip">زبائن <b class="num">'+r.customers+'</b></span><span class="chip">مبيعات <b class="num">'+r.sales+'</b></span>'+
    '<span class="chip '+convClass(cv)+'">النسبة <b class="num">'+pct(cv)+'</b></span><span class="chip">بالساعة <b class="num">'+money(ph)+'</b></span><span class="chip">للزبون <b class="num">'+money(pc)+'</b></span></div></button>';
}
function renderDay(){
  var d=S.day, t=today();
  $('dayLabel').textContent=fmtDay(d);
  $('dayRel').textContent = d===t?'• اليوم':d===addDays(t,-1)?'• أمس':'';
  $('dayInput').value=d; $('dayInput').max=t;
  $('dayNext').style.opacity = d>=t?.35:1;
  var rows=S.data.entries.filter(function(r){ return r.date===d; }).sort(function(a,b){ return b.amount-a.amount; });
  var a=agg(rows);
  $('dayKpis').innerHTML=kpiHtml(a,'إجمالي مبيعات اليوم');
  $('dayCount').textContent=rows.length?rows.length+' سجل':'';
  $('dayList').innerHTML = rows.length? rows.map(entryCard).join('') : '<div class="empty"><b>لا توجد سجلات لهذا اليوم</b>اضغط + لإضافة سجل موظف</div>';
  var done={}; rows.forEach(function(r){ done[r.name]=1; });
  var miss=S.data.employees.filter(function(e){ return e.active && !done[e.name]; });
  $('dayMissingWrap').classList.toggle('hidden', !miss.length || d<addDays(t,-6));
  $('missCount').textContent=miss.length+' موظف';
  $('dayMissing').innerHTML=miss.map(function(e){ return '<button class="mbtn" data-name="'+esc(e.name)+'">+ '+esc(e.name)+'</button>'; }).join('');
}
$('dayList').onclick=function(e){ var b=e.target.closest('[data-row]'); if(b) openEntry(Number(b.dataset.row)); };
$('dayMissing').onclick=function(e){ var b=e.target.closest('[data-name]'); if(b) openEntry(null,b.dataset.name); };
$('fab').onclick=function(){ openEntry(null); };

/* ================= ENTRY FORM ================= */
var F={name:''};
function openEntry(row,presetName){
  var r = row? S.data.entries.filter(function(x){ return x.row===row; })[0] : null;
  S.editing=r||null;
  $('entryTitle').textContent = r?'تعديل سجل':'سجل جديد';
  $('delBtn').classList.toggle('hidden',!r);
  $('fDate').value = r? r.date : (S.view==='day'?S.day:today());
  $('fDate').max = today();
  F.name = r? r.name : (presetName||'');
  $('fSearch').value='';
  $('fHours').value = r? r.hours : 6;
  $('fCust').value = r? r.customers : '';
  $('fSales').value = r? r.sales : '';
  $('fAmount').value = r? r.amount : '';
  ['hName','hHours','hCust','hSales','hAmount'].forEach(function(h){ $(h).textContent=''; });
  document.querySelectorAll('#entrySheet .inp').forEach(function(i){ i.classList.remove('err'); });
  drawNames(); preview();
  $('saveBtn').disabled=false; $('saveBtn').textContent='حفظ';
  showSheet('entrySheet');
}
function drawNames(){
  var q=$('fSearch').value.trim(), date=$('fDate').value;
  var done={}; S.data.entries.forEach(function(r){ if(r.date===date && (!S.editing || r.row!==S.editing.row)) done[r.name]=1; });
  var list=S.data.employees.filter(function(e){ return e.active || e.name===F.name; }).map(function(e){ return e.name; });
  if(F.name && list.indexOf(F.name)<0) list.unshift(F.name);
  if(q) list=list.filter(function(n){ return n.indexOf(q)>=0; });
  var h=list.map(function(n){ return '<button type="button" class="'+(n===F.name?'on ':'')+(done[n]?'done':'')+'" data-n="'+esc(n)+'">'+esc(n)+(done[n]?' ✓':'')+'</button>'; }).join('');
  if(q && !S.data.employees.some(function(e){ return e.name===q; })) h+='<button type="button" data-n="'+esc(q)+'" data-new="1">+ إضافة «'+esc(q)+'»</button>';
  $('fNames').innerHTML = h || '<span style="color:var(--muted);font-size:14px">لا يوجد موظفون — اكتب اسماً لإضافته</span>';
  $('fNameSel').textContent = F.name? '— '+F.name : '';
}
$('fNames').onclick=function(e){ var b=e.target.closest('[data-n]'); if(!b) return; F.name=b.dataset.n; if(b.dataset.new) $('fSearch').value=''; $('hName').textContent=''; drawNames(); };
$('fSearch').oninput=drawNames;
$('fDate').onchange=drawNames;
document.querySelectorAll('[data-step]').forEach(function(b){ b.onclick=function(){ var v=parseFloat($('fHours').value)||0; v=Math.min(24,Math.max(0.5,v+parseFloat(b.dataset.step))); $('fHours').value=v; preview(); }; });
['fHours','fCust','fSales','fAmount'].forEach(function(id){ $(id).addEventListener('input',function(){ this.value=toLatin(this.value); this.classList.remove('err'); preview(); }); });
function toLatin(s){ return String(s).replace(/[٠-٩]/g,function(c){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(c); }).replace(/[۰-۹]/g,function(c){ return '۰۱۲۳۴۵۶۷۸۹'.indexOf(c); }).replace(/[٫,]/g,'.').replace(/[^\d.]/g,''); }
function vals(){ return { hours:parseFloat($('fHours').value), customers:$('fCust').value===''?NaN:Number($('fCust').value), sales:$('fSales').value===''?NaN:Number($('fSales').value), amount:$('fAmount').value===''?NaN:Number($('fAmount').value) }; }
function preview(){
  var v=vals();
  $('pHour').textContent = v.hours>0 && v.amount>=0 ? money(v.amount/v.hours) : '—';
  $('pConv').textContent = v.customers>0 && v.sales>=0 ? pct(v.sales/v.customers) : '—';
  $('pAvg').textContent = v.sales>0 && v.amount>=0 ? money(v.amount/v.sales) : '—';
}
function validateForm(){
  var v=vals(), ok=true;
  function bad(inp,hint,msg){ ok=false; if(inp) $(inp).classList.add('err'); $(hint).textContent=msg; }
  ['hName','hHours','hCust','hSales','hAmount'].forEach(function(h){ $(h).textContent=''; });
  if(!F.name) bad(null,'hName','اختر الموظف');
  if(!$('fDate').value) { ok=false; $('fDate').classList.add('err'); }
  else if($('fDate').value>today()) { ok=false; $('fDate').classList.add('err'); toast('لا يمكن التسجيل لتاريخ مستقبلي','bad'); }
  if(!(v.hours>0 && v.hours<=24)) bad('fHours','hHours','بين 0.5 و 24 ساعة');
  if(isNaN(v.customers) || v.customers<0 || v.customers%1) bad('fCust','hCust','رقم صحيح');
  if(isNaN(v.sales) || v.sales<0 || v.sales%1) bad('fSales','hSales','رقم صحيح');
  else if(v.sales>v.customers) bad('fSales','hSales','أكبر من عدد الزبائن');
  if(isNaN(v.amount) || v.amount<0) bad('fAmount','hAmount','أدخل المبلغ');
  else if(v.sales>0 && v.amount===0) bad('fAmount','hAmount','المبلغ لا يمكن أن يكون 0 مع وجود مبيعات');
  else if(v.sales===0 && v.amount>0) bad('fSales','hSales','يوجد مبلغ بدون مبيعات');
  return ok? v : null;
}
$('saveBtn').onclick=function(){ save(false); };
function save(force){
  var v=validateForm(); if(!v) return;
  var entry={ date:$('fDate').value, name:F.name, hours:v.hours, customers:v.customers, sales:v.sales, amount:v.amount };
  if(S.editing){ entry.row=S.editing.row; entry.origName=S.editing.name; }
  var btn=$('saveBtn'); btn.disabled=true; btn.textContent='جارٍ الحفظ…';
  call('apiSaveEntry',S.pin,entry,force).then(function(res){
    if(res && res.duplicate){
      btn.disabled=false; btn.textContent='حفظ';
      return confirmBox('سجل مكرر', 'يوجد سجل لـ «'+entry.name+'» بتاريخ '+fmtDay(entry.date)+'. هل تريد إضافة سجل آخر لنفس اليوم؟','نعم، احفظ').then(function(y){ if(y){ showSheet('entrySheet'); save(true); } });
    }
    hideSheet(); S.day=entry.date; setData(res);
    toast(S.editing?'تم تعديل السجل ✓':'تم حفظ السجل ✓','ok');
  }).catch(function(e){ btn.disabled=false; btn.textContent='حفظ'; toast(errMsg(e),'bad'); });
}
$('delBtn').onclick=function(){
  var r=S.editing; if(!r) return;
  confirmBox('حذف السجل','سيتم حذف سجل «'+r.name+'» بتاريخ '+fmtDay(r.date)+' نهائياً من الجدول.','حذف').then(function(y){
    if(!y) return;
    $('loading').classList.remove('hidden');
    call('apiDeleteEntry',S.pin,r.row,r.name).then(function(res){ setData(res); toast('تم حذف السجل','ok'); })
    .catch(function(e){ toast(errMsg(e),'bad'); }).then(function(){ $('loading').classList.add('hidden'); });
  });
};

/* ================= STAFF ================= */
function segHtml(items,cur){ return items.map(function(p){ return '<button data-k="'+p[0]+'" class="'+(p[0]===cur?'on':'')+'">'+p[1]+'</button>'; }).join(''); }
var METRICS=[['amount','المبلغ'],['perHour','بالساعة'],['conv','النسبة'],['perCust','معدل الزبون']];
$('staffPeriod').onclick=function(e){ var b=e.target.closest('[data-k]'); if(b){ S.staffP=b.dataset.k; renderStaff(); } };
$('staffMetric').onclick=function(e){ var b=e.target.closest('[data-k]'); if(b){ S.staffM=b.dataset.k; renderStaff(); } };
function metricVal(a,m){ return m==='conv'?pct(a.conv):money(a[m]); }
function renderStaff(){
  $('staffPeriod').innerHTML=segHtml(PERIODS,S.staffP);
  $('staffMetric').innerHTML=segHtml(METRICS,S.staffM);
  var rg=periodRange(S.staffP), m=S.staffM;
  var list=byEmployee(S.data.entries.filter(function(r){ return inRange(r,rg[0],rg[1]); }));
  list.sort(function(a,b){ return b[m]-a[m]; });
  var max=list.length? Math.max.apply(null,list.map(function(a){ return a[m]; })) : 0;
  $('staffList').innerHTML = list.length? list.map(function(a,i){
    return '<button class="entry" data-emp="'+esc(a.name)+'"><div class="entry-h"><div class="who"><div class="rank r'+(i+1)+'">'+(i+1)+'</div><div class="av">'+esc(initials(a.name))+'</div><div><b>'+esc(a.name)+'</b><small>'+a.nd+' يوم • '+n1(a.hours)+' ساعة</small></div></div><div class="amt num">'+metricVal(a,m)+'</div></div>'+
      '<div class="bar"><i style="width:'+(max?Math.max(3,a[m]/max*100):0)+'%"></i></div>'+
      '<div class="chips"><span class="chip">المبلغ <b class="num">'+money(a.amount)+'</b></span><span class="chip '+convClass(a.conv)+'">النسبة <b class="num">'+pct(a.conv)+'</b></span><span class="chip">بالساعة <b class="num">'+money(a.perHour)+'</b></span><span class="chip">للزبون <b class="num">'+money(a.perCust)+'</b></span></div></button>';
  }).join('') : '<div class="empty"><b>لا توجد بيانات</b>لا توجد سجلات في '+esc(rg[2])+'</div>';
}
$('staffList').onclick=function(e){ var b=e.target.closest('[data-emp]'); if(b) openEmp(b.dataset.emp); };
function openEmp(name){
  var rg=periodRange(S.staffP);
  var rows=S.data.entries.filter(function(r){ return r.name===name && inRange(r,rg[0],rg[1]); }).sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
  var a=agg(rows);
  $('empTitle').textContent=name+' — '+rg[2];
  var byDay={}; rows.forEach(function(r){ byDay[r.date]=(byDay[r.date]||0)+r.amount; });
  var h='<div class="kpis">'+kpiHtml(a,'إجمالي المبيعات')+'</div>';
  if(rows.length>1) h+='<div class="chart">'+barChart(Object.keys(byDay).sort().map(function(k){ return [k,byDay[k]]; }))+'</div>';
  h+='<div class="sec-title"><h2>السجلات</h2><span>'+rows.length+'</span></div><div class="list">'+
    (rows.map(function(r){ return entryCard(r).replace('<div><b>'+esc(r.name)+'</b>','<div><b>'+fmtDay(r.date)+'</b>'); }).join('') || '<div class="empty">لا توجد سجلات</div>')+'</div>';
  $('empBody').innerHTML=h;
  showSheet('empSheet');
}
$('empBody').onclick=function(e){ var b=e.target.closest('[data-row]'); if(b){ openEntry(Number(b.dataset.row)); } };

/* ================= REPORTS ================= */
$('repPeriod').onclick=function(e){ var b=e.target.closest('[data-k]'); if(b){ S.repP=b.dataset.k; renderRep(); } };
function barChart(pts){
  if(!pts.length) return '<div class="empty" style="border:0">لا توجد بيانات</div>';
  var W=340,H=170,pl=6,pr=6,pt=18,pb=22, n=pts.length, max=Math.max.apply(null,pts.map(function(p){ return p[1]; }))||1;
  var bw=(W-pl-pr)/n, g=Math.min(4,bw*.25), s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="رسم بياني للمبيعات اليومية">';
  for(var k=1;k<=3;k++){ var y=pt+(H-pt-pb)*(1-k/3); s+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#2f2b23" stroke-dasharray="3 4"/>'; }
  var best=0; pts.forEach(function(p,i){ if(p[1]>pts[best][1]) best=i; });
  pts.forEach(function(p,i){
    var h=(H-pt-pb)*(p[1]/max), x=W-pr-(i+1)*bw+g/2, y=H-pb-h; // RTL: الأحدث يسار
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(1,bw-g).toFixed(1)+'" height="'+Math.max(1,h).toFixed(1)+'" rx="'+Math.min(4,(bw-g)/2).toFixed(1)+'" fill="'+(i===best?'#f5cf6b':'#b8914a')+'"><title>'+fmtShort(p[0])+': '+money(p[1])+'</title></rect>';
    if(i===best) s+='<text x="'+(x+(bw-g)/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" fill="#f5cf6b" font-size="10" text-anchor="middle" font-weight="700">'+money(p[1])+'</text>';
    var every=Math.ceil(n/7);
    if(i%every===0 || i===n-1) s+='<text x="'+(x+(bw-g)/2).toFixed(1)+'" y="'+(H-6)+'" fill="#6e675a" font-size="10" text-anchor="middle">'+fmtShort(p[0])+'</text>';
  });
  return s+'</svg>';
}
function renderRep(){
  $('repPeriod').innerHTML=segHtml(PERIODS,S.repP);
  var rg=periodRange(S.repP);
  var rows=S.data.entries.filter(function(r){ return inRange(r,rg[0],rg[1]); });
  var a=agg(rows);
  $('repKpis').innerHTML=kpiHtml(a,'إجمالي المبيعات — '+rg[2])+
    '<div class="kpi"><label>أيام العمل</label><b class="num">'+a.nd+'</b></div><div class="kpi"><label>متوسط اليوم</label><b class="num">'+money(a.nd?a.amount/a.nd:0)+'</b></div>';
  var byDay={}; rows.forEach(function(r){ byDay[r.date]=(byDay[r.date]||0)+r.amount; });
  var pts=Object.keys(byDay).sort().map(function(k){ return [k,byDay[k]]; });
  if(S.repP==='all' && pts.length>60) pts=pts.slice(-60);
  $('repChartCap').textContent=pts.length?pts.length+' يوم':'';
  $('repChart').innerHTML=barChart(pts);
  var emps=byEmployee(rows);
  var top=emps.slice().sort(function(x,y){ return y.amount-x.amount; }).slice(0,5);
  var mx=top.length?top[0].amount:0;
  $('repTop').innerHTML=top.map(function(e,i){ return '<button class="entry" data-emp="'+esc(e.name)+'"><div class="entry-h"><div class="who"><div class="rank r'+(i+1)+'">'+(i+1)+'</div><div><b>'+esc(e.name)+'</b><small>'+e.nd+' يوم</small></div></div><div class="amt num">'+money(e.amount)+'</div></div><div class="bar"><i style="width:'+(mx?e.amount/mx*100:0)+'%"></i></div></button>'; }).join('') || '<div class="empty">لا توجد بيانات</div>';
  var conv=emps.filter(function(e){ return e.nd>=3; }).sort(function(x,y){ return y.conv-x.conv; }).slice(0,5);
  $('repConv').innerHTML=conv.map(function(e,i){ return '<button class="entry" data-emp="'+esc(e.name)+'"><div class="entry-h"><div class="who"><div class="rank r'+(i+1)+'">'+(i+1)+'</div><div><b>'+esc(e.name)+'</b><small>'+e.sales+' من '+e.customers+' زبون</small></div></div><div class="amt num" style="color:var(--green)">'+pct(e.conv)+'</div></div></button>'; }).join('') || '<div class="empty">لا توجد بيانات كافية</div>';
}
$('repTop').onclick=$('repConv').onclick=function(e){ var b=e.target.closest('[data-emp]'); if(b){ S.staffP=S.repP; openEmp(b.dataset.emp); } };

/* ================= SETTINGS ================= */
function renderSet(){
  var emps=S.data.employees.slice().sort(function(a,b){ return (b.active-a.active) || a.name.localeCompare(b.name,'ar'); });
  $('empCount').textContent=emps.filter(function(e){return e.active;}).length+' فعال من '+emps.length;
  $('empList').innerHTML=emps.map(function(e){ return '<button class="set-item" data-toggle="'+esc(e.name)+'" data-act="'+(e.active?1:0)+'"><div>'+esc(e.name)+'<small>'+(e.active?'اضغط للإيقاف':'اضغط للتفعيل')+'</small></div><span class="tag '+(e.active?'':'off')+'">'+(e.active?'فعال':'موقوف')+'</span></button>'; }).join('');
  $('sheetLink').href=S.data.sheetUrl||'#';
  var fixed=S.data.entries.filter(function(r){ return r.dateFixed; }).length;
  $('fixNote').textContent = fixed? 'ملاحظة: '+fixed+' سجل قديم في الجدول تاريخه فارغ أو فيه خطأ في السنة، التطبيق يقرأه تلقائياً بتاريخ الصف الذي قبله.' : '';
}
$('empList').onclick=function(e){
  var b=e.target.closest('[data-toggle]'); if(!b) return;
  var name=b.dataset.toggle, act=b.dataset.act==='1';
  confirmBox(act?'إيقاف موظف':'تفعيل موظف', act?'لن يظهر «'+name+'» في قائمة الإدخال اليومي، وتبقى سجلاته القديمة محفوظة.':'سيظهر «'+name+'» مجدداً في قائمة الإدخال.', act?'إيقاف':'تفعيل').then(function(y){
    if(!y) return;
    call('apiSetEmployeeActive',S.pin,name,!act).then(function(d){ setData(d); toast('تم التحديث','ok'); }).catch(function(e){ toast(errMsg(e),'bad'); });
  });
};
$('addEmpBtn').onclick=function(){
  var n=$('newEmp').value.trim(); if(!n){ $('newEmp').focus(); return; }
  var b=this; b.disabled=true;
  call('apiAddEmployee',S.pin,n).then(function(d){ $('newEmp').value=''; setData(d); toast('تمت إضافة '+n,'ok'); }).catch(function(e){ toast(errMsg(e),'bad'); }).then(function(){ b.disabled=false; });
};
$('pinBtn').onclick=function(){
  var p=toLatin($('newPin').value);
  if(!/^\d{4,8}$/.test(p)){ toast('الرمز يجب أن يكون من 4 إلى 8 أرقام','bad'); return; }
  call('apiChangePin',S.pin,p).then(function(){ S.pin=p; sset('pin',p); $('newPin').value=''; toast('تم تغيير رمز الدخول','ok'); }).catch(function(e){ toast(errMsg(e),'bad'); });
};
$('logoutBtn').onclick=function(){ sset('pin',null); sset('cache',null); S.pin=''; S.data=null; showLogin(); };

/* ================= START ================= */
if(S.pin) load(true); else showLogin();
})();
</script>
