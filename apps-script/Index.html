function renderRecords(){const rows=selectedRecords(trash).filter(r=>(r.branch+' '+r.notes+' '+r.date).toLowerCase().includes(search.toLowerCase()));$('main').innerHTML='<div class="toolbar"><div class="segmented"><button class="btn '+(!trash?'selected':'')+'" onclick="trash=false;recordLimit=40;renderRecords()">السجلات</button><button class="btn '+(trash?'selected':'')+'" onclick="trash=true;recordLimit=40;renderRecords()">المحذوفات</button></div><button class="btn" onclick="exportCsv()">↓ تصدير CSV</button></div><div class="toolbar"><input class="search" id="search" aria-label="بحث بالسجلات" placeholder="ابحث باسم الفرع أو الملاحظات…" value="'+esc(search)+'"><span class="muted">'+rows.length+' سجل</span></div>'+(trash?'<p class="notice">السجلات المحذوفة محفوظة للاسترجاع، ولا تدخل في ملخص المصاريف أو التصدير.</p>':'')+(rows.length?'<section class="panel">'+rows.slice(0,recordLimit).map(recordCard).join('')+'</section>'+(rows.length>recordLimit?'<div class="pagination"><button class="btn" onclick="recordLimit+=40;renderRecords()">عرض المزيد ('+(rows.length-recordLimit)+')</button></div>':''):empty('لا توجد سجلات مطابقة','غيّر التصفية أو أضف سجل مصاريف جديد.'));$('search').oninput=e=>{search=e.target.value;recordLimit=40;const pos=e.target.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(view!=='records')return;renderRecords();$('search').focus();$('search').setSelectionRange(pos,pos)},150);};}

function readForm(){draft.date=$('recordDate').value;draft.branch=$('recordBranch').value;draft.notes=$('recordNotes').value;document.querySelectorAll('[data-amount]').forEach(el=>draft.amounts[Number(el.dataset.amount)]=Math.round(Number(el.value||0)*100));if(draft.salaryMode==='employees'){const previous=draft.payroll;draft.payroll=Array.from(document.querySelectorAll('[data-employee]')).map(el=>({employeeId:el.dataset.employee,employeeName:previous.find(p=>p.employeeId===el.dataset.employee)?.employeeName||data.employees.find(e=>e.id===el.dataset.employee)?.name||'',amount:Math.round(Number(el.value||0)*100)})).filter(p=>p.amount>0);draft.amounts[2]=draft.payroll.reduce((sum,p)=>sum+p.amount,0)}else draft.payroll=[]}

onclick="navigate(\'records\')">عرض الكل ←</button></div>'+(rows.length?rows.slice(0,5).map(recordCard).join(''):'<p class="muted">لا توجد سجلات في الفترة المحددة.</p>')+'</section>';

function employeeDialog(branchId,id){
 const branch=data.branches.find(b=>b.id===branchId);if(!branch)return;const employee=data.employees.find(e=>e.id===id),employeeId=employee?employee.id:uid();
 ask(employee?'تعديل اسم الموظف':'إضافة موظف إلى '+branch.name,'<label>اسم الموظف<input id="employeeName" maxlength="100" value="'+esc(employee?.name||'')+'" autocomplete="off" placeholder="اسم الموظف"></label>','حفظ الموظف',()=>{const name=$('employeeName').value.trim();if(!name){$('employeeName').focus();return}mutate('saveEmployee',{id:employeeId,create:!employee,branchId,name,fingerprint:employee?.fingerprint},'تم حفظ الموظف')});$('employeeName').focus();$('employeeName').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('dialogConfirm').click()}};
}
function toggleEmployee(id){const employee=data.employees.find(e=>e.id===id);if(!employee)return;ask(employee.active?'إيقاف الموظف؟':'تفعيل الموظف؟','<p>'+esc(employee.name)+'</p><p>ستبقى رواتبه وسجلاته السابقة محفوظة.</p>',employee.active?'إيقاف':'تفعيل',()=>mutate('setEmployeeActive',{id,fingerprint:employee.fingerprint,active:!employee.active},'تم تحديث حالة الموظف'))}
