        if (x.indexOf('ar') === 0) return 'ar';

    var l = p.get('lang');
    if (l !== 'he' && l !== 'ar') l = detectDeviceLang();
    document.documentElement.lang = l;
    document.documentElement.dataset.lang = l;
  })();

  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --silver: #d4d4d4;
      --silver-light: #f5f5f5;
      --accent: #ffffff;
      --gold: #e5e5e5;
      --gold-light: #fafafa;
      --success: #22c55e;
      --danger: #ffffff;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --border: rgba(255,255,255,.12);
      --radius: 16px;
      --shadow: 0 20px 60px rgba(0,0,0,.55);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Assistant', 'Cairo', system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1a1a1a 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 90px;
    }
    html[lang="ar"] body { font-family: 'Cairo', 'Assistant', system-ui, sans-serif; }

    .lang-switch {
      position: fixed; top: 12px; left: 12px; z-index: 150;
      display: flex; gap: 4px;
      background: rgba(20,20,20,.92); backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: 999px; padding: 4px;
    }
    .lang-switch button {
      border: none; background: transparent; color: var(--muted);
      font-family: inherit; font-size: 13px; font-weight: 700;
      padding: 6px 12px; border-radius: 999px; cursor: pointer;
    }
    .lang-switch button.active {
      background: linear-gradient(135deg, #404040, #0a0a0a);
      color: #fff; border: 1px solid rgba(255,255,255,.2);
    }

    .announce {
      background: linear-gradient(90deg, #0a0a0a, #262626, #0a0a0a);
      border-bottom: 1px solid rgba(255,255,255,.15);
      padding: 10px 16px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--silver-light);
    }
    .announce strong { color: #fff; }

    /* Hero image — same as TikTok ad */
    .hero-image-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0;
      position: relative;
    }
    .hero-image-wrap img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    .hero-image-wrap .hero-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center bottom, rgba(255,255,255,.08), transparent 70%);
      pointer-events: none;
    }
    @media (min-width: 769px) {
      .hero-image-wrap { padding: 16px 16px 0; }
    }

    /* Hero */
    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 16px 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: start;
    }
    @media (max-width: 768px) {
      .hero { grid-template-columns: 1fr; gap: 16px; padding-top: 12px; }
      .hero-form { order: 3; }
      .hero-content { order: 2; }
    }

    .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .badge {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.18);
      color: var(--silver-light);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
    }

    h1, h2, .section-title {
      font-family: 'Playfair Display', 'Cairo', 'Assistant', serif;
    }
    h1 {
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    h1 em { color: #fff; font-style: normal; }

    .stars { color: var(--silver); font-size: 20px; letter-spacing: 2px; margin-bottom: 16px; }

    .offer-names {
      font-size: 13px;
      color: var(--silver);
      margin-bottom: 16px;
      line-height: 1.75;
    }

    .benefits { list-style: none; margin-bottom: 20px; }
    .benefits li {
      display: flex; gap: 10px; align-items: flex-start;
      font-size: 14px; margin-bottom: 8px; color: #d4d4d4;
    }
    .benefits li::before { content: '◆'; color: #fff; font-weight: 800; flex-shrink: 0; }

    .price-box {
      background: linear-gradient(135deg, rgba(20,20,20,.95), rgba(38,38,38,.8));
      border: 1px solid rgba(255,255,255,.15);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .price-now { font-size: 36px; font-weight: 800; color: var(--danger); }
    .price-now small { font-size: 20px; }
    .price-was { font-size: 18px; color: var(--muted); text-decoration: line-through; }
    .price-save {
      background: rgba(255,255,255,.08);
      color: var(--silver-light);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
    }

    /* Countdown */
    .countdown-wrap { margin-bottom: 20px; }
    .countdown-label { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: var(--muted); }
    .countdown {
      display: flex; gap: 10px; justify-content: flex-start;
    }
    .cd-unit {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      text-align: center;
      min-width: 64px;
    }
    .cd-num { font-size: 26px; font-weight: 800; color: var(--gold); line-height: 1; }
    .cd-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .hero-headline-mobile {
      display: none;
      text-align: center;
      padding: 12px 16px 0;
      max-width: 680px;
      margin: 0 auto;
    }
    @media (max-width: 768px) {
      .hero-headline-mobile { display: block; }
      .hero-content .badge-row,
      .hero-content h1,
      .hero-content .stars { display: none; }
    }
    .hero-headline-mobile h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    .hero-headline-mobile .price-inline {
      font-size: 28px;
      font-weight: 800;
      color: var(--danger);
    }
    .hero-headline-mobile .price-inline span {
      font-size: 16px;
      color: var(--muted);
      text-decoration: line-through;
      margin-right: 8px;
    }

    /* Form */
    .form-card {
      background: linear-gradient(180deg, rgba(20,20,20,.98), rgba(28,28,28,.95));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      position: sticky; top: 16px;
    }
    .form-card h2 {
      font-size: 18px; font-weight: 800; margin-bottom: 4px;
    }
    .form-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
    .field input {
      width: 100%; padding: 13px 14px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 16px;
      font-family: inherit; outline: none;
      transition: border-color .2s;
    }
    .field input:focus { border-color: #fff; }
    .field input.error { border-color: var(--danger); }

    .checkbox-row {
      display: flex; gap: 10px; align-items: flex-start;
      font-size: 13px; color: var(--muted); margin: 14px 0;
    }
    .checkbox-row input { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; accent-color: #fff; }

    .btn-submit {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #262626, #0a0a0a);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 14px;
      color: #fff; font-size: 17px; font-weight: 800;
      font-family: inherit; cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(0,0,0,.55); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .form-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }

    /* Sections */
    section { max-width: 1100px; margin: 0 auto; padding: 48px 16px; }
    .section-title {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 800; text-align: center; margin-bottom: 32px;
    }
    .section-title span { color: var(--gold); }

    /* Trust grid */
    .trust-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 600px) { .trust-grid { grid-template-columns: 1fr; } }
    .trust-card {
      background: linear-gradient(180deg, rgba(20,20,20,.92), rgba(28,28,28,.8));
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
    }
    .trust-icon { font-size: 32px; margin-bottom: 12px; }
    .trust-card h3 { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
    .trust-card p { font-size: 13px; color: var(--muted); }

    /* Testimonials */
    .testimonials {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .testimonial {
      background: linear-gradient(180deg, rgba(20,20,20,.92), rgba(28,28,28,.8));
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .testimonial img { width: 100%; aspect-ratio: 4/3; object-fit: cover; }
    .testimonial-body { padding: 14px; }
    .testimonial-stars { color: var(--silver); font-size: 14px; margin-bottom: 6px; }
    .testimonial-text { font-size: 13px; color: #d4d4d4; }

    .faq-list { max-width: 700px; margin: 0 auto; }
    .faq-item {
      background: linear-gradient(180deg, rgba(20,20,20,.92), rgba(28,28,28,.8));
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .faq-q {
      width: 100%; background: none; border: none;
      color: var(--text); font-family: inherit;
      font-size: 15px; font-weight: 700;
      padding: 16px 20px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      text-align: right;
    }
    .faq-q::after { content: '+'; font-size: 20px; color: #fff; transition: transform .2s; }
    .faq-item.open .faq-q::after { transform: rotate(45deg); }
    .faq-a {
      max-height: 0; overflow: hidden;
      transition: max-height .3s ease;
      font-size: 14px; color: var(--muted);
      padding: 0 20px;
    }
    .faq-item.open .faq-a { max-height: 200px; padding: 0 20px 16px; }

    /* Sticky mobile CTA */
    .sticky-cta {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10,10,10,.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,.12);
      padding: 12px 16px;
      z-index: 100;
      gap: 12px; align-items: center;
    }
    @media (max-width: 768px) {
      .sticky-cta { display: flex; }
    }
    .sticky-price { font-size: 20px; font-weight: 800; color: var(--danger); white-space: nowrap; }
    .sticky-cta .btn-submit { padding: 12px; font-size: 15px; }

    /* Toast & overlay */
    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #404040, #0a0a0a); color: #fff;
      padding: 14px 24px; border-radius: 999px;
      font-weight: 700; z-index: 200; display: none;
      box-shadow: var(--shadow);
    }
    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.7);
      display: none; align-items: center; justify-content: center; z-index: 300;
    }
    #overlay.show { display: flex; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(244,114,182,.2);
      border-top-color: var(--rose);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success modal */
    #successModal {
      position: fixed; inset: 0; background: rgba(0,0,0,.8);
      display: none; align-items: center; justify-content: center;
      z-index: 400; padding: 20px;
    }
    #successModal.show { display: flex; }
    .success-box {
      background: linear-gradient(180deg, rgba(20,20,20,.98), rgba(28,28,28,.95));
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 24px; padding: 32px; max-width: 420px;
      text-align: center;
    }
    .success-box .icon { font-size: 48px; margin-bottom: 16px; }
    .success-box h2 { font-size: 22px; margin-bottom: 8px; }
    .success-box p { color: var(--muted); font-size: 14px; }
  </style>
</head>

/* Countdown — ends Sunday 23:59 */
function getEndOfWeek() {
  const now = new Date();
  const day = now.getDay();
  const daysUntilSunday = day === 0 ? 0 : 7 - day;
  const end = new Date(now);
  end.setDate(now.getDate() + daysUntilSunday);
  end.setHours(23, 59, 59, 999);
  return end;
}
function updateCountdown() {
  const diff = getEndOfWeek() - Date.now();
  if (diff <= 0) return;
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('cd-d').textContent = String(d).padStart(2,'0');
  document.getElementById('cd-h').textContent = String(h).padStart(2,'0');
  document.getElementById('cd-m').textContent = String(m).padStart(2,'0');
  document.getElementById('cd-s').textContent = String(s).padStart(2,'0');
}
updateCountdown();
setInterval(updateCountdown, 1000);

function normalizePhone(value) {
  const digits = String(value || '').replace(/\D/g, '');
  if (/^05\d{8}$/.test(digits)) return digits;
  if (/^5\d{8}$/.test(digits)) return '0' + digits;
  if (/^9725\d{8}$/.test(digits) || /^9705\d{8}$/.test(digits)) return '0' + digits.slice(3);
  if (/^009725\d{8}$/.test(digits) || /^009705\d{8}$/.test(digits)) return '0' + digits.slice(5);
  return digits;
}

function isValidPhone(value) {
  return /^05\d{8}$/.test(normalizePhone(value));
}

function postOrderInBackground(payload) {

    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body
  }).catch(function() {
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon(ORDER_WEBAPP_URL, new Blob([body], { type: 'text/plain;charset=utf-8' }));
      }
    } catch (e) {}
  });
}

function simpleHash(text) {
  let hash = 0;
  for (let i = 0; i < text.length; i++) {
    hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
  }
  return Math.abs(hash).toString(36);
}

function orderFingerprint(payload) {
  const itemText = (payload.items || []).map(item => [
    item.product_id || item.code,
    Number(item.qty || 0),
    Number(item.unit_price || 0),
    Number(item.line_total || 0)
  ].join(':')).sort().join('|');
  return 'mad-order-' + simpleHash([
    normalizePhone(payload.phone),
    String(payload.city || '').trim().toLowerCase(),
    itemText,
    Number(payload.subtotal || 0),
    Number(payload.delivery_fee || 0),
    Number(payload.final_total || payload.total || 0)
  ].join('||'));
}

function readRecentOrder(fingerprint) {
  try {
    const record = JSON.parse(localStorage.getItem(RECENT_ORDER_KEY) || 'null');
    if (!record || record.fingerprint !== fingerprint) return null;
    if (Date.now() - Number(record.savedAt || 0) > ORDER_DUPLICATE_WINDOW_MS) return null;
    return record;
  } catch (e) { return null; }
}

function rememberRecentOrder(payload) {
  try {
    localStorage.setItem(RECENT_ORDER_KEY, JSON.stringify({
      fingerprint: payload.idempotency_key,
      orderId: payload.orderId,
      savedAt: Date.now(),
      total: payload.final_total || payload.total || payload.price
    }));
  } catch (e) {}
}

function forgetRecentOrder(fingerprint) {
  try {
    const record = JSON.parse(localStorage.getItem(RECENT_ORDER_KEY) || 'null');
    if (record && record.fingerprint === fingerprint) localStorage.removeItem(RECENT_ORDER_KEY);
  } catch (e) {}
}

    const opts = properties.event_id ? { eventID: properties.event_id } : undefined;
    window.fbq('trackCustom', 'SubmitForm', properties, opts);
    window.fbq('track', 'Lead', { currency: properties.currency, value: properties.value }, opts);
  } else if (eventName === 'Lead' && window.fbq && typeof window.fbq === 'function') {
    const opts = properties.event_id ? { eventID: properties.event_id } : undefined;
    window.fbq('track', 'Lead', properties, opts);
  }
}

        content_id: p.code,
        content_type: 'product',
        content_name: p.name,
        quantity: 1,
        price: BUNDLE_UNIT_PRICE
      };
    }),
    event_id: payload.orderId,
    num_items: 4,
    currency: 'ILS',
    value,
    description: payload.source_page || 'offer4'
  });
}

function finishOrderSuccess(btn, payload) {
  trackSubmitFormConversion(payload);
  document.getElementById('successModal').classList.add('show');
  document.getElementById('f_name').value = '';
  document.getElementById('f_phone').value = '';
  document.getElementById('f_city').value = '';
  document.getElementById('f_address').value = '';
  document.getElementById('f_confirm').checked = false;
  document.getElementById('overlay').classList.remove('show');
  btn.disabled = false;
  isSubmittingOrder = false;
}

function submitOrder() {
  if (isSubmittingOrder) return;

  const name = document.getElementById('f_name').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const city = document.getElementById('f_city').value.trim();
  const address = document.getElementById('f_address').value.trim();
  const confirmed = document.getElementById('f_confirm').checked;
  const btn = document.getElementById('btnSubmit');

  document.querySelectorAll('.field input').forEach(i => i.classList.remove('error'));

  if (!name) { document.getElementById('f_name').classList.add('error'); return showToast(t('errName')); }
  if (!isValidPhone(phone)) { document.getElementById('f_phone').classList.add('error'); return showToast(t('errPhone')); }
  if (!city) { document.getElementById('f_city').classList.add('error'); return showToast(t('errCity')); }
  if (!address) { document.getElementById('f_address').classList.add('error'); return showToast(t('errAddress')); }
  if (!confirmed) return showToast(t('errConfirm'));

  const customer = { name, phone, city, address };
  const payload = buildOrderPayload(customer);
  payload.idempotency_key = orderFingerprint(payload);
  payload.duplicate_window_ms = ORDER_DUPLICATE_WINDOW_MS;

  const recentOrder = readRecentOrder(payload.idempotency_key);
  if (recentOrder) {
    finishOrderSuccess(btn, payload);
    return;
  }

  isSubmittingOrder = true;
  btn.disabled = true;

  trackPixel('InitiateCheckout', {
    content_type: 'product',
    content_id: 'L102-W183-L103-Q105',
    content_ids: ['L102', 'W183', 'L103', 'Q105'],
    content_name: payload.offer,
    currency: 'ILS',
    value: BUNDLE_PRICE,
    num_items: 4
  });

  rememberRecentOrder(payload);
  finishOrderSuccess(btn, payload);
  postOrderInBackground(payload);
}

function getUtmNotes() {
  const parts = [];
  ['utm_source','utm_medium','utm_campaign','utm_id','ttclid'].forEach(k => {
    const v = trackingParam(k);
    if (v) parts.push(k + '=' + v);
  });
  parts.push('lang=' + currentLang);
  return parts.length ? 'UTM: ' + parts.join(' | ') : 'offer4 | lang=' + currentLang;
}
</script>
