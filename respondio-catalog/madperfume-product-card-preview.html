  he:{search:'חיפוש לפי קוד, שם או קטגוריה', open:'פתיחת דף מוצר', code:'קוד', category:'קטגוריה', price:'מחיר', cta:'להזמנה עכשיו', brand:'MAD PERFUME', fallback:'אין תמונה', copied:'טקסט המוצר הועתק.', downloadBlocked:'אם שרת התמונות חוסם הורדת PNG, אפשר להשתמש בצילום מסך של הכרטיס.'}
};
const search=document.getElementById('search');
const select=document.getElementById('products');
const canvas=document.getElementById('card');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');

function norm(value){ return String(value || '').toLowerCase(); }
function currentLabels(){ return labels[lang]; }
function setLang(next) {
  lang=next;
  document.documentElement.lang=lang;
  document.documentElement.dir='rtl';
  document.getElementById('arBtn').classList.toggle('active', lang==='ar');
  document.getElementById('heBtn').classList.toggle('active', lang==='he');
  search.placeholder=currentLabels().search;
  document.getElementById('selectedLink').textContent=currentLabels().open;
  filterProducts();
}
function filterProducts() {
  const q=norm(search.value);
  filtered=DATA[lang].filter(p=>!q || norm([p.c,p.n,p.cat,p.p].join(' ')).includes(q));
  select.innerHTML='';
  for (const p of filtered) {
    const opt=document.createElement('option');
    opt.value=p.c + '|' + p.url;
    opt.textContent=`${p.c} - ${p.n}`;
    select.appendChild(opt);
  }
  selected=filtered[0] || null;
  if (selected) select.value=selected.c + '|' + selected.url;
  updateMeta();
  drawCard();
}
function pickSelected() {
  selected=filtered.find(p=>select.value===p.c + '|' + p.url) || filtered[0] || null;
  updateMeta();
  drawCard();
}
function updateMeta() {
  const l=currentLabels();
  document.getElementById('selectedName').textContent=selected ? selected.n : '';
  document.getElementById('selectedCategory').textContent=selected ? `${l.category}: ${selected.cat}` : '';
  document.getElementById('selectedCode').textContent=selected ? `${l.code}: ${selected.c}` : '';
  document.getElementById('selectedPrice').textContent=selected ? `${l.price}: ${selected.p} ILS` : '';
  const link=document.getElementById('selectedLink');
  link.href=selected ? selected.url : '#';
  link.hidden=!selected;
}
function roundRect(x,y,w,h,r,fill,stroke) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}
function fitImage(img, x, y, w, h) {
  const scale=Math.min(w/img.naturalWidth, h/img.naturalHeight);
  const iw=img.naturalWidth*scale;
  const ih=img.naturalHeight*scale;
  ctx.drawImage(img, x+(w-iw)/2, y+(h-ih)/2, iw, ih);
}
function wrapText(text, x, y, maxWidth, lineHeight, maxLines, align='right') {
  ctx.textAlign=align;
  ctx.direction='rtl';
  const words=String(text || '').split(/\s+/);
  let line='';
  let lines=[];
  for (const word of words) {
    const test=line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line=word;
    } else {
      line=test;
    }
  }
  if (line) lines.push(line);
  lines=lines.slice(0,maxLines);
  if (lines.length===maxLines && words.length>0) {
    while (ctx.measureText(lines[lines.length-1] + '...').width > maxWidth && lines[lines.length-1].length>2) {
      lines[lines.length-1]=lines[lines.length-1].slice(0,-1);
    }
    lines[lines.length-1]+='...';
  }
  lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lineHeight));
  return y + lines.length*lineHeight;
}
function baseCard() {
  ctx.clearRect(0,0,1080,1350);
  ctx.fillStyle='#eef4f3';
  ctx.fillRect(0,0,1080,1350);
  ctx.fillStyle='#ffffff';
  roundRect(70,60,940,1230,48,true,false);
  ctx.fillStyle='#0b6b63';
  roundRect(70,60,940,148,48,true,false);
  ctx.fillRect(70,140,940,72);
  ctx.fillStyle='#ffffff';
  ctx.font='700 48px Arial';
  ctx.textAlign='center';
  ctx.direction='ltr';
  ctx.fillText('MAD PERFUME',540,143);
  ctx.fillStyle='#8e3151';
  roundRect(130,240,820,570,30,true,false);
  ctx.fillStyle='#ffffff';
  roundRect(145,255,790,540,24,true,false);
}
function drawFallbackImage() {
  ctx.fillStyle='#f5f7f7';
  roundRect(165,275,750,500,20,true,false);
  ctx.fillStyle='#c9d6d3';
  ctx.font='700 42px Arial';
  ctx.textAlign='center';
  ctx.direction='rtl';
  ctx.fillText(currentLabels().fallback,540,540);
}
function drawDetails() {
  if (!selected) return;
  const l=currentLabels();
  ctx.fillStyle='#17212b';
  ctx.font='700 58px Arial';
  const afterName=wrapText(selected.n,920,895,760,70,2,'right');
  ctx.fillStyle='#667482';
  ctx.font='400 34px Arial';
  ctx.fillText(`${l.category}: ${selected.cat}`,920,afterName+28);
  ctx.fillText(`${l.code}: ${selected.c}`,920,afterName+78);
  ctx.fillStyle='#b7782e';
  roundRect(130,1088,310,96,26,true,false);
  ctx.fillStyle='#ffffff';
  ctx.font='700 44px Arial';
  ctx.textAlign='center';
  ctx.direction='ltr';
  ctx.fillText(`${selected.p} ILS`,285,1150);
  ctx.fillStyle='#0b6b63';
  roundRect(470,1088,480,96,26,true,false);
  ctx.fillStyle='#ffffff';
  ctx.font='700 40px Arial';
  ctx.direction='rtl';
  ctx.fillText(l.cta,710,1150);
  ctx.fillStyle='#667482';
  ctx.font='400 26px Arial';
  ctx.fillText(selected.url.replace('https://',''),540,1240);
}
function drawCard() {
  baseCard();
  if (!selected) {
    drawFallbackImage();
    return;
  }
  const img=new Image();
  img.onload=()=>{ baseCard(); fitImage(img,165,275,750,500); drawDetails(); };
  img.onerror=()=>{ baseCard(); drawFallbackImage(); drawDetails(); };
  img.src=selected.img;
  drawFallbackImage();
  drawDetails();
}
function downloadCard() {
  try {
    canvas.toBlob(blob=>{
      if (!blob) { statusEl.textContent=currentLabels().downloadBlocked; return; }
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=`madperfume-${selected ? selected.c : 'product'}.png`;
      a.click();
      URL.revokeObjectURL(a.href);
    }, 'image/png');
  } catch (err) {
    statusEl.textContent=currentLabels().downloadBlocked;
  }
}
function copyText() {
  if (!selected) return;
  const l=currentLabels();
  const text=`${selected.n}\n${l.code}: ${selected.c}\n${l.category}: ${selected.cat}\n${l.price}: ${selected.p} ILS\n${selected.url}`;
  navigator.clipboard?.writeText(text);
  statusEl.textContent=l.copied;
}
document.getElementById('arBtn').addEventListener('click',()=>setLang('ar'));
document.getElementById('heBtn').addEventListener('click',()=>setLang('he'));
search.addEventListener('input',filterProducts);
select.addEventListener('change',pickSelected);
document.getElementById('download').addEventListener('click',downloadCard);
document.getElementById('copyText').addEventListener('click',copyText);
filterProducts();
</script>
</body>
</html>
