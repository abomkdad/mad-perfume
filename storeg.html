<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827"><title>شراء الوكلاء من المخزن | MAD</title>
<style>

8px;line-height:1.2;overflow:hidden}.code{font-size:12px;color:var(--muted);direction:ltr;text-align:right}.price{color:#15803d;font-weight:900;margin
</style>
</head><body><div class="app">
<header class="top"><div class="brand"><div class="logo">MAD <b>مخزن الوكلاء</b></div><div class="tools"><button class="iconBtn" onclick="openPrice()" id="priceBtn">🔒 الأسعار</button></div></div><div class="searchWrap"><input id="search" class="search" type="search" placeholder="ابحث بالاسم أو الكود" autocomplete="off"></div></header>
<nav id="cats" class="cats"></nav><div id="info" class="info">جاري الاتصال بالنظام...</div><main id="grid" class="grid"><div class="loading">جاري تحميل المنتجات...</div></main>
<div class="bottom"><button onclick="openOrders()">طلباتي</button><button class="cartBtn" onclick="openCart()">السلة <span id="cartCount" class="badge">0</span></button></div></div>
<div id="productModal" class="overlay" onclick="backdrop(event,this)"><section class="modal"><div class="handle"></div><button class="close" onclick="closeModal('productModal')">×</button><img id="modalImage" class="modalPic"><h2 id="modalName"></h2><div id="modalCode" class="code"></div><div id="modalPrice" class="price"></div><div class="qty"><button onclick="stepQty(-1)">−</button><input id="qty" type="number" min="1" inputmode="numeric"><button onclick="stepQty(1)">+</button></div><button class="primary" onclick="addSelected()">إضافة إلى السلة</button></section></div>
<div id="priceModal" class="overlay" onclick="backdrop(event,this)"><section class="modal"><div class="handle"></div><button class="close" onclick="closeModal('priceModal')">×</button><h2>إظهار أسعار الوكلاء</h2><input id="pricePassword" class="field" type="password" inputmode="numeric" placeholder="الرقم السري"><div id="priceError" class="error"></div><button class="primary" onclick="unlockPrices()">تأكيد</button></section></div>
<div id="cartModal" class="overlay" onclick="backdrop(event,this)"><section class="modal"><div class="handle"></div><button class="close" onclick="closeModal('cartModal')">×</button><h2>سلة الطلب</h2><div id="cartItems"></div><div id="cartTotal" class="total"></div><select id="dealerName" class="field" onchange="dealerChanged()"><option value="">جاري تحميل أسماء الفروع...</option></select><input id="dealerOther" class="field" style="display:none" placeholder="اكتب اسم الفرع"><input id="employeeName" class="field" placeholder="اسم الموظف"><input id="dealerPhone" class="field" type="tel" placeholder="رقم الهاتف"><textarea id="dealerNotes" class="field" placeholder="ملاحظات"></textarea><button id="sendBtn" class="primary" onclick="sendOrder()">إرسال الطلب إلى المخزن</button></section></div>
<div id="ordersModal" class="overlay" onclick="backdrop(event,this)"><section class="modal"><div class="handle"></div><button class="close" onclick="closeModal('ordersModal')">×</button><h2>طلباتي</h2><div id="ordersList">جاري التحميل...</div></section></div><div id="toast" class="toast"></div>
<script>
var API='https://mad-perfume.vercel.app/api/dealer';
var products=[],filtered=[],cart=JSON.parse(localStorage.getItem('dealerCart')||'[]'),selected=null,priceUnlocked=false,priceToken='',activeCat='الكل',editingOrderId='',lastOrders=[];
var fallback='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="100%" height="100%" fill="#f3f4f6"/><text x="50%" y="50%" text-anchor="middle" fill="#9ca3af" font-size="18">MAD</text></svg>');
function api(params){return new Promise(function(resolve,reject){var cb='madCb'+Date.now()+Math.random().toString(16).slice(2),s=document.createElement('script'),timer;params.callback=cb;window[cb]=function(data){clearTimeout(timer);delete window[cb];s.remove();data&&data.ok?resolve(data):reject(new Error(data&&data.error||'فشل الاتصال'))};s.onerror=function(){clearTimeout(timer);delete window[cb];s.remove();reject(new Error('تعذر الاتصال بالنظام'))};s.src=API+'?'+Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');document.head.appendChild(s);timer=setTimeout(function(){s.onerror()},20000)})}
function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function money(v){return '₪'+Number(v||0).toFixed(2)}function show(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2400)}function closeModal(id){document.getElementById(id).classList.remove('open')}function backdrop(e,x){if(e.target===x)x.classList.remove('open')}
function useProducts(list){products=(list||[]).filter(function(p){return Number(p.stock||0)>0});buildCats();applyFilter();syncCart()}
function loadProducts(){document.getElementById('info').textContent='جاري تحميل مخزون المستودع...';api({action:'catalog',password:priceUnlocked?priceToken:''}).then(function(r){useProducts(r.products||[]);if(!products.length)throw new Error('لا توجد منتجات متوفرة في المخزن')}).catch(function(e){document.getElementById('grid').innerHTML='<div class="empty">'+esc(e.message)+'<br><button class="cat" onclick="loadProducts()">إعادة المحاولة</button></div>';document.getElementById('info').textContent='تعذر تحميل مخزون المستودع'})}
function buildCats(){var cs=['الكل'];products.forEach(function(p){var c=p.brand||'بدون تصنيف';if(cs.indexOf(c)<0)cs.push(c)});document.getElementById('cats').innerHTML=cs.map(function(c){return '<button class="cat '+(c===activeCat?'active':'')+'" onclick="setCat(this.dataset.cat)" data-cat="'+esc(c)+'">'+esc(c)+'</button>'}).join('')}
function setCat(c){activeCat=c;buildCats();applyFilter()}function applyFilter(){var q=document.getElementById('search').value.trim().toLowerCase();filtered=products.filter(function(p){return(activeCat==='الكل'||(p.brand||'بدون تصنيف')===activeCat)&&(!q||(p.name+' '+p.code).toLowerCase().indexOf(q)>=0)});render()}
function render(){document.getElementById('info').textContent='متوفر '+filtered.length+' من '+products.length+' صنف في المخزن';document.getElementById('grid').innerHTML=filtered.map(function(p){return '<article class="card"><img class="pic" loading="lazy" src="'+esc(p.image||fallback)+'" onerror="this.src=fallback"><div class="body"><div class="tag">'+esc(p.brand||'')+'</div><div class="name">'+esc(p.name)+'</div><div class="code">'+esc(p.code)+'</div><div class="tag" style="color:#15803d;margin-top:5px">متوفر: '+Number(p.stock||0)+'</div>'+(priceUnlocked?'<div class="price">'+money(p.price)+'</div>':'<div class="hidden">🔒 السعر مخفي</div>')+'<button class="add" data-code="'+esc(p.code)+'" onclick="openProduct(this.dataset.code)">اختيار الكمية</button></div></article>'}).join('')||'<div class="empty">لا توجد نتائج</div>'}
function openProduct(code){selected=products.find(function(p){return p.code===code});if(!selected)return;modalImage.src=selected.image||fallback;modalName.textContent=selected.name;modalCode.textContent='الكود: '+selected.code+' — المتوفر: '+Number(selected.stock||0);modalPrice.textContent=priceUnlocked?money(selected.price):'🔒 السعر مخفي';qty.max=Math.max(1,Number(selected.stock||1));qty.value=Math.min(6,qty.max);productModal.classList.add('open')}function stepQty(n){qty.value=Math.min(999,Math.max(1,(parseInt(qty.value)||6)+n*6))}function addSelected(){var q=Math.min(Number(selected.stock||1),Math.max(1,parseInt(qty.value)||1)),x=cart.find(function(i){return i.code===selected.code});if(x)x.quantity+=q;else cart.push({code:selected.code,name:selected.name,quantity:q,price:selected.price});syncCart();closeModal('productModal');show('تمت الإضافة إلى السلة')}
function syncCart(){localStorage.setItem('dealerCart',JSON.stringify(cart));cartCount.textContent=cart.reduce(function(s,i){return s+i.quantity},0);cartTotal.textContent=priceUnlocked?'الإجمالي: '+money(cart.reduce(function(s,i){var p=products.find(function(x){return x.code===i.code});return s+i.quantity*Number(p&&p.price||0)},0)):'الأسعار مخفية'}
function openCart(){if(!cart.length)return show('السلة فارغة');renderCart();cartModal.classList.add('open')}function renderCart(){cartItems.innerHTML=cart.map(function(i,n){return '<div class="cartItem"><span><b>'+esc(i.name)+'</b><br><small>'+esc(i.code)+'</small></span><input type="number" min="1" value="'+i.quantity+'" onchange="cart['+n+'].quantity=Math.max(1,parseInt(this.value)||1);syncCart();renderCart()"><button class="del" onclick="cart.splice('+n+',1);syncCart();renderCart()">×</button></div>'}).join('');syncCart()}
function openPrice(){priceModal.classList.add('open');setTimeout(function(){document.getElementById('pricePassword').focus()},50)}function unlockPrices(){var v=document.getElementById('pricePassword').value;document.getElementById('priceError').textContent='';api({action:'verify',password:v}).then(function(r){if(!r.result.valid){document.getElementById('priceError').textContent='الرقم السري غير صحيح';return}priceUnlocked=true;priceToken=v;priceBtn.textContent='🔓 الأسعار';closeModal('priceModal');loadProducts()}).catch(function(e){document.getElementById('priceError').textContent=e.message})}
function currentDealer(){return(dealerName.value==='__other__'?dealerOther.value:dealerName.value).trim()}function dealerChanged(){dealerOther.style.display=dealerName.value==='__other__'?'block':'none';if(dealerName.value&&dealerName.value!=='__other__'){localStorage.setItem('dealerBranch',dealerName.value);openOrders()}}
function sendOrder(){var dealer=currentDealer();if(!dealer)return show('اختر اسم الفرع');var data={dealerName:dealer,employeeName:employeeName.value.trim(),phone:dealerPhone.value.trim(),notes:dealerNotes.value.trim(),items:cart.map(function(i){return{code:i.code,quantity:i.quantity}})};if(editingOrderId)data.orderId=editingOrderId;sendBtn.disabled=true;sendBtn.textContent=editingOrderId?'جاري حفظ التعديل...':'جاري الإرسال...';api({action:editingOrderId?'update':'submit',payload:JSON.stringify(data)}).then(function(r){var id=editingOrderId||r.result.orderId,ids=JSON.parse(localStorage.getItem('dealerOrderIds')||'[]');if(ids.indexOf(id)<0)ids.unshift(id);localStorage.setItem('dealerOrderIds',JSON.stringify(ids.slice(0,50)));cart=[];editingOrderId='';syncCart();closeModal('cartModal');show(data.orderId?'تم تعديل الطلب':'تم إرسال الطلب: '+id);openOrders()}).catch(function(e){show(e.message)}).finally(function(){sendBtn.disabled=false;sendBtn.textContent='إرسال الطلب إلى المخزن'})}
function editableStatus(s){s=String(s||'').toLowerCase();return !/(مجهز|تم التجهيز|جاهز|قيد التوصيل|تم التسليم|ملغي|ready|prepared|completed|delivered|cancel)/.test(s)}
function renderOrders(list){lastOrders=list||[];ordersList.innerHTML=lastOrders.map(function(o,n){return '<div class="order"><span class="status">'+esc(o.status)+'</span><b>'+esc(o.orderId)+'</b><div>'+esc(o.dealerName)+'</div><small>'+o.items.map(function(i){return esc(i.name||i.code)+' × '+i.quantity}).join('<br>')+'</small>'+(priceUnlocked?'<div class="price">'+money(o.total)+'</div>':'')+(editableStatus(o.status)?'<button class="cat" style="margin-top:10px" onclick="editOrder('+n+')">تعديل الطلب</button>':'')+'</div>'}).join('')||'لا توجد طلبات لهذا الفرع'}
function openOrders(){var dealer=currentDealer()||localStorage.getItem('dealerBranch')||'';ordersModal.classList.add('open');ordersList.textContent=dealer?'جاري تحميل طلبات '+dealer+'...':'اختر اسم الفرع أولاً';if(!dealer)return;api({action:'branchOrders',dealer:dealer,password:priceUnlocked?priceToken:''}).then(function(r){renderOrders(r.orders||[])}).catch(function(){var ids=JSON.parse(localStorage.getItem('dealerOrderIds')||'[]');if(!ids.length)return renderOrders([]);api({action:'orders',ids:ids.join(','),password:priceUnlocked?priceToken:''}).then(function(r){renderOrders((r.orders||[]).filter(function(o){return o.dealerName===dealer}))}).catch(function(e){ordersList.textContent=e.message})})}
