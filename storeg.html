<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827"><title>طلبات الوكلاء | MAD</title>
<style>
:root{--red:#c81e2b;--ink:#111827;--muted:#6b7280;--bg:#f3f4f6;--line:#e5e7eb;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;min-height:100%;overscroll-behavior-y:none}button,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;box-shadow:0 2px 12px #0003}.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-size:20px;font-weight:900;letter-spacing:.5px}.logo b{color:#ef3340}.tools{display:flex;gap:7px}.iconBtn{border:1px solid #ffffff2a;background:#ffffff12;color:#fff;border-radius:12px;min-height:40px;padding:8px 11px;font-weight:800}.search{margin-top:10px;width:100%;height:46px;border:0;border-radius:13px;padding:0 42px 0 14px;background:#fff;color:#111827;outline:none;font-size:16px}.searchWrap{position:relative}.searchWrap:before{content:'⌕';position:absolute;right:14px;top:14px;color:#6b7280;font-size:20px}.cats{display:flex;gap:8px;overflow:auto;padding:10px 10px 2px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:700;white-space:nowrap}.cat.active{background:var(--ink);color:#fff;border-color:var(--ink)}.info{padding:8px 12px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 10px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #1118270d;min-width:0}.pic{aspect-ratio:1/1;width:100%;object-fit:contain;background:#fafafa;display:block}.body{padding:10px}.tag{font-size:11px;color:var(--red);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name{font-weight:900;margin:5px 0;min-height:38px;line-height:1.2;overflow:hidden}.code{font-size:12px;color:var(--muted);direction:ltr;text-align:right}.price{color:#15803d;font-weight:900;margin-top:7px}.hidden{color:#9ca3af;font-size:12px;margin-top:7px}.add{width:100%;border:0;background:var(--red);color:#fff;border-radius:10px;padding:10px 4px;font-weight:900;margin-top:9px}.loading,.empty{text-align:center;padding:50px 20px;color:var(--muted)}.bottom{position:fixed;z-index:22;bottom:0;right:0;left:0;padding:8px 10px calc(8px + var(--safe));background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom button{height:48px;border-radius:13px;font-weight:900;border:1px solid var(--line);background:#fff}.bottom .cartBtn{background:var(--red);color:#fff;border-color:var(--red)}.badge{display:inline-grid;place-items:center;background:#fff;color:var(--red);border-radius:99px;min-width:22px;height:22px;margin-right:6px}.overlay{position:fixed;z-index:50;inset:0;background:#0008;display:none;align-items:flex-end}.overlay.open{display:flex}.modal{background:#fff;width:100%;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--safe));box-shadow:0 -10px 40px #0004}.handle{width:46px;height:5px;border-radius:9px;background:#d1d5db;margin:-7px auto 14px}.close{float:left;border:0;background:#f3f4f6;border-radius:50%;width:38px;height:38px;font-size:19px}.modal h2{margin:4px 0 16px}.modalPic{width:120px;height:120px;object-fit:contain;display:block;margin:auto}.qty{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;margin:16px 0}.qty button,.qty input{height:48px;border:1px solid var(--line);border-radius:12px;text-align:center;background:#fff;font-weight:900}.primary{width:100%;height:50px;border:0;border-radius:13px;background:var(--red);color:#fff;font-weight:900}.field{width:100%;height:48px;border:1px solid #d1d5db;border-radius:12px;padding:0 12px;margin:5px 0 10px;outline:none}.field:focus{border-color:var(--red)}textarea.field{height:78px;padding-top:12px;resize:none}.cartItem{display:grid;grid-template-columns:1fr 76px 42px;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.cartItem input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;text-align:center}.del{border:0;background:#fee2e2;color:#b91c1c;border-radius:10px;height:40px}.total{font-size:18px;font-weight:900;padding:14px 0}.error{color:#b91c1c;min-height:20px}.order{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.status{float:left;background:#fef3c7;color:#92400e;border-radius:99px;padding:4px 8px;font-size:12px}.toast{position:fixed;z-index:100;bottom:86px;right:50%;transform:translateX(50%);background:#111827;color:#fff;border-radius:12px;padding:11px 16px;display:none;max-width:90%;text-align:center}@media(min-width:700px){body:before{content:'هذه الصفحة مصممة للجوال';display:block;text-align:center;background:#fef3c7;padding:8px}.app{max-width:520px;margin:auto}.bottom{max-width:520px;margin:auto}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head><body><div class="app">
<header class="top"><div class="brand"><div class="logo">MAD <b>PARFUMEUR</b></div><div class="tools"><button class="iconBtn" onclick="openPrice()" id="priceBtn">🔒 الأسعار</button></div></div><div class="searchWrap"><input id="search" class="search" type="search" placeholder="ابحث بالاسم أو الكود" autocomplete="off"></div></header>
<nav id="cats" class="cats"></nav><div id="info" class="info">جاري الاتصال بالنظام...</div><main id="grid" class="grid"><div class="loading">جاري تحميل المنتجات...</div></main>
<div class="bottom"><button onclick="openOrders()">طلباتي</button><button class="cartBtn" onclick="openCart()">السلة <span id="cartCount" class="badge">0</span></button></div></div>
<div id="productModal" class="overlay" onclick="backdrop(event,this)"><section class="modal"><div class="handle"></div><button class="close" onclick="closeModal('productModal')">×</button><img id="modalImage" class="modalPic"><h2 id="modalName"></h2><div id="modalCode" class="code"></div><div id="modalPrice" class="price"></div><div class="qty"><button onclick="stepQty(-1)">−</button><input id="qty" type="number" min="1" inputmode="numeric"><button onclick="stepQty(1)">+</button></div><button class="primary" onclick="addSelected()">إضافة إلى السلة</button></section></div>
<div id="priceModal" class="overlay" onclick="backdrop(event,this)"><section class="modal"><div class="handle"></div><button class="close" onclick="closeModal('priceModal')">×</button><h2>إظهار أسعار الوكلاء</h2><input id="pricePassword" class="field" type="password" inputmode="numeric" placeholder="الرقم السري"><div id="priceError" class="error"></div><button class="primary" onclick="unlockPrices()">تأكيد</button></section></div>
<div id="cartModal" class="overlay" onclick="backdrop(event,this)"><section class="modal"><div class="handle"></div><button class="close" onclick="closeModal('cartModal')">×</button><h2>سلة الطلب</h2><div id="cartItems"></div><div id="cartTotal" class="total"></div><input id="dealerName" class="field" placeholder="اسم الفرع / الوكيل *"><input id="employeeName" class="field" placeholder="اسم الموظف"><input id="dealerPhone" class="field" type="tel" placeholder="رقم الهاتف"><textarea id="dealerNotes" class="field" placeholder="ملاحظات"></textarea><button id="sendBtn" class="primary" onclick="sendOrder()">إرسال الطلب إلى المخزن</button></section></div>
<div id="ordersModal" class="overlay" onclick="backdrop(event,this)"><section class="modal"><div class="handle"></div><button class="close" onclick="closeModal('ordersModal')">×</button><h2>طلباتي</h2><div id="ordersList">جاري التحميل...</div></section></div><div id="toast" class="toast"></div>
<script>
var API='https://script.google.com/macros/s/AKfycbyctz_KmDwfvjk3aGM5gwRbCX-msE8K8TCHHgfMRhlyoW0yQyCn0qVzvN87Bbg8WZ3BcA/exec';
var products=[],filtered=[],cart=JSON.parse(localStorage.getItem('dealerCart')||'[]'),selected=null,priceUnlocked=false,priceToken='',activeCat='الكل';
var fallback='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="100%" height="100%" fill="#f3f4f6"/><text x="50%" y="50%" text-anchor="middle" fill="#9ca3af" font-size="18">MAD</text></svg>');
function api(params){return new Promise(function(resolve,reject){var cb='madCb'+Date.now()+Math.random().toString(16).slice(2),s=document.createElement('script'),timer;params.callback=cb;window[cb]=function(data){clearTimeout(timer);delete window[cb];s.remove();data&&data.ok?resolve(data):reject(new Error(data&&data.error||'فشل الاتصال'))};s.onerror=function(){clearTimeout(timer);delete window[cb];s.remove();reject(new Error('تعذر الاتصال بالنظام'))};s.src=API+'?'+Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');document.head.appendChild(s);timer=setTimeout(function(){s.onerror()},20000)})}
function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function money(v){return '₪'+Number(v||0).toFixed(2)}function show(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2400)}function closeModal(id){document.getElementById(id).classList.remove('open')}function backdrop(e,x){if(e.target===x)x.classList.remove('open')}
function loadProducts(){document.getElementById('info').textContent='جاري تحميل المنتجات...';api({action:'catalog',password:priceUnlocked?priceToken:''}).then(function(r){products=r.products||[];buildCats();applyFilter();syncCart()}).catch(function(e){document.getElementById('grid').innerHTML='<div class="empty">'+esc(e.message)+'<br><button class="cat" onclick="loadProducts()">إعادة المحاولة</button></div>';document.getElementById('info').textContent='تعذر التحميل'})}
function buildCats(){var cs=['الكل'];products.forEach(function(p){var c=p.brand||'بدون تصنيف';if(cs.indexOf(c)<0)cs.push(c)});document.getElementById('cats').innerHTML=cs.map(function(c){return '<button class="cat '+(c===activeCat?'active':'')+'" onclick="setCat(this.dataset.cat)" data-cat="'+esc(c)+'">'+esc(c)+'</button>'}).join('')}
function setCat(c){activeCat=c;buildCats();applyFilter()}function applyFilter(){var q=document.getElementById('search').value.trim().toLowerCase();filtered=products.filter(function(p){return(activeCat==='الكل'||(p.brand||'بدون تصنيف')===activeCat)&&(!q||(p.name+' '+p.code).toLowerCase().indexOf(q)>=0)});render()}
function render(){document.getElementById('info').textContent='عرض '+filtered.length+' من '+products.length+' منتج';document.getElementById('grid').innerHTML=filtered.map(function(p){return '<article class="card"><img class="pic" loading="lazy" src="'+esc(p.image||fallback)+'" onerror="this.src=fallback"><div class="body"><div class="tag">'+esc(p.brand||'')+'</div><div class="name">'+esc(p.name)+'</div><div class="code">'+esc(p.code)+'</div>'+(priceUnlocked?'<div class="price">'+money(p.price)+'</div>':'<div class="hidden">🔒 السعر مخفي</div>')+'<button class="add" data-code="'+esc(p.code)+'" onclick="openProduct(this.dataset.code)">اختيار الكمية</button></div></article>'}).join('')||'<div class="empty">لا توجد نتائج</div>'}
function openProduct(code){selected=products.find(function(p){return p.code===code});if(!selected)return;modalImage.src=selected.image||fallback;modalName.textContent=selected.name;modalCode.textContent='الكود: '+selected.code;modalPrice.textContent=priceUnlocked?money(selected.price):'🔒 السعر مخفي';qty.value=6;productModal.classList.add('open')}function stepQty(n){qty.value=Math.min(999,Math.max(1,(parseInt(qty.value)||6)+n*6))}function addSelected(){var q=Math.max(1,parseInt(qty.value)||1),x=cart.find(function(i){return i.code===selected.code});if(x)x.quantity+=q;else cart.push({code:selected.code,name:selected.name,quantity:q,price:selected.price});syncCart();closeModal('productModal');show('تمت الإضافة إلى السلة')}
function syncCart(){localStorage.setItem('dealerCart',JSON.stringify(cart));cartCount.textContent=cart.reduce(function(s,i){return s+i.quantity},0);cartTotal.textContent=priceUnlocked?'الإجمالي: '+money(cart.reduce(function(s,i){var p=products.find(function(x){return x.code===i.code});return s+i.quantity*Number(p&&p.price||0)},0)):'الأسعار مخفية'}
function openCart(){if(!cart.length)return show('السلة فارغة');renderCart();cartModal.classList.add('open')}function renderCart(){cartItems.innerHTML=cart.map(function(i,n){return '<div class="cartItem"><span><b>'+esc(i.name)+'</b><br><small>'+esc(i.code)+'</small></span><input type="number" min="1" value="'+i.quantity+'" onchange="cart['+n+'].quantity=Math.max(1,parseInt(this.value)||1);syncCart();renderCart()"><button class="del" onclick="cart.splice('+n+',1);syncCart();renderCart()">×</button></div>'}).join('');syncCart()}
function openPrice(){priceModal.classList.add('open');setTimeout(function(){document.getElementById('pricePassword').focus()},50)}function unlockPrices(){var v=document.getElementById('pricePassword').value;document.getElementById('priceError').textContent='';api({action:'verify',password:v}).then(function(r){if(!r.result.valid){document.getElementById('priceError').textContent='الرقم السري غير صحيح';return}priceUnlocked=true;priceToken=v;priceBtn.textContent='🔓 الأسعار';closeModal('priceModal');loadProducts()}).catch(function(e){document.getElementById('priceError').textContent=e.message})}
function sendOrder(){var dealer=dealerName.value.trim();if(!dealer)return show('اسم الفرع أو الوكيل مطلوب');var data={dealerName:dealer,employeeName:employeeName.value.trim(),phone:dealerPhone.value.trim(),notes:dealerNotes.value.trim(),items:cart.map(function(i){return{code:i.code,quantity:i.quantity}})};sendBtn.disabled=true;sendBtn.textContent='جاري الإرسال...';api({action:'submit',payload:JSON.stringify(data)}).then(function(r){var ids=JSON.parse(localStorage.getItem('dealerOrderIds')||'[]');ids.unshift(r.result.orderId);localStorage.setItem('dealerOrderIds',JSON.stringify(ids.slice(0,50)));cart=[];syncCart();closeModal('cartModal');show('تم إرسال الطلب: '+r.result.orderId)}).catch(function(e){show(e.message)}).finally(function(){sendBtn.disabled=false;sendBtn.textContent='إرسال الطلب إلى المخزن'})}
function openOrders(){ordersModal.classList.add('open');ordersList.textContent='جاري التحميل...';var ids=JSON.parse(localStorage.getItem('dealerOrderIds')||'[]');if(!ids.length){ordersList.textContent='لا توجد طلبات محفوظة على هذا الجهاز';return}api({action:'orders',ids:ids.join(','),password:priceUnlocked?priceToken:''}).then(function(r){ordersList.innerHTML=(r.orders||[]).map(function(o){return '<div class="order"><span class="status">'+esc(o.status)+'</span><b>'+esc(o.orderId)+'</b><div>'+esc(o.dealerName)+'</div><small>'+o.items.map(function(i){return esc(i.name)+' × '+i.quantity}).join('<br>'))+'</small>'+(priceUnlocked?'<div class="price">'+money(o.total)+'</div>':'')+'</div>'}).join('')||'لم يتم العثور على الطلبات'}).catch(function(e){ordersList.textContent=e.message})}
document.getElementById('search').addEventListener('input',applyFilter);loadProducts();syncCart();
</script></body></html>
