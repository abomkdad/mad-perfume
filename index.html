<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סניפי MAD PERFUME</title>
<meta name="robots" content="noindex, follow">
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap');
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;min-height:100vh;background:#fff;font-family:Heebo,Arial,sans-serif;color:#1c1330;text-align:center}
.m-top{flex:0 0 auto;padding:6px 16px;background:#fff}
.m-top img{height:96px;width:auto;display:block;margin:0 auto}
.m-hero{flex:0 0 auto;background:#000;line-height:0}
.m-hero img{width:100%;height:clamp(250px,42vh,460px);object-fit:cover;object-position:50% 50%;display:block}
@media(min-width:900px){.m-hero img{height:auto;aspect-ratio:3/1}}
.m-body{flex:1 0 auto;background:linear-gradient(180deg,#efe9fa,#e2d9f4);padding:32px 22px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-size:clamp(30px,5vw,44px);font-weight:800;line-height:1.15;margin:0 0 12px;color:#2c1a5c}
p{font-size:clamp(17px,2.4vw,20px);line-height:1.5;margin:0 auto 24px;max-width:520px;color:#3d3358}
a.m-btn{display:block;width:100%;max-width:380px;background:#3b2470;color:#fff;padding:17px 24px;border-radius:12px;font-size:20px;font-weight:700;text-decoration:none;box-shadow:0 8px 22px rgba(59,36,112,.28)}
.m-url{margin-top:12px;font-size:15px;font-weight:500;color:#3b2470;direction:ltr}
.m-foot{margin-top:18px;font-size:15px;color:#5a4f75}
</style>
</head>
<body>
<div class="m-top"><img src="https://cdn.shopify.com/s/files/1/0721/7184/8002/files/mad-logo.png?v=1792448262" alt="MAD Parfumeur"></div>
<div class="m-hero"><img src="https://madperfumeur.co.il/cdn/shop/files/mad-banner-men-selective.jpg?width=1600" alt="בושם MAD"></div>
<div class="m-body">
<h1>סניפי MAD PERFUME</h1>
<p>מעל 40 סניפים ברחבי הארץ. כתובות, שעות פתיחה וניווט מהיר, הכול במקום אחד.</p>
<a class="m-btn" href="https://madperfumeur.co.il/pages/branches">לרשימת הסניפים</a>
<div class="m-url">madperfumeur.co.il</div>
<div class="m-foot">שירות לקוחות 9935*</div>
</div>
</body>
</html>
